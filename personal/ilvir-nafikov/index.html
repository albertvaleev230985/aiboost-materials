  <style>
    :root {
      --bg: #F5F6F8;
      --card: #FFFFFF;
      --text: #1F2430;
      --muted: #6B7280;
      --line: #E5E7EB;
      --coral: #E07461;
      --coral-dark: #C75A49;
      --coral-soft: #FDF0EC;
      --green: #2FA36B;
      --green-soft: #E8F6EE;
      --yellow: #E0A93E;
      --yellow-soft: #FCF4E3;
      --radius: 18px;
      --shadow: 0 1px 2px rgba(31, 36, 48, 0.05), 0 8px 24px rgba(31, 36, 48, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding-bottom: calc(76px + env(safe-area-inset-bottom));
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }

    /* Шапка */
    .topbar {
      position: sticky; top: 0; z-index: 20;
      background: rgba(245, 246, 248, 0.92);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      padding-top: env(safe-area-inset-top);
    }
    .topbar-in { display: flex; align-items: center; gap: 10px; min-height: 54px; }
    .brand { font-weight: 800; font-size: 15px; letter-spacing: -0.01em; }
    .brand b { color: var(--coral); }
    .back {
      display: inline-flex; align-items: center; gap: 4px;
      font-weight: 700; font-size: 15px; color: var(--coral-dark);
      padding: 8px 4px 8px 0;
    }
    .back svg { width: 20px; height: 20px; }
    .topbar-right { margin-left: auto; font-size: 13px; color: var(--muted); font-weight: 600; }

    /* Общие блоки */
    .screen { padding: 18px 0 28px; }
    .hero h1 { font-size: 30px; line-height: 1.1; font-weight: 850; letter-spacing: -0.02em; }
    .kicker { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--coral-dark); margin-bottom: 8px; }
    .lead { color: #3A4150; font-size: 15.5px; margin-top: 10px; }
    .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
    .section { margin-top: 26px; }
    .section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .section-h h2 { font-size: 19px; font-weight: 800; letter-spacing: -0.01em; }
    .section-h span { font-size: 13px; color: var(--muted); }
    .muted { color: var(--muted); }

    /* Прогресс */
    .progress { margin-top: 16px; }
    .progress-row { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; margin-bottom: 8px; }
    .bar { height: 10px; background: #E9EBEF; border-radius: 99px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--coral), #EB9A86); border-radius: 99px; transition: width .4s ease; }

    /* Продолжить */
    .next { margin-top: 18px; display: grid; gap: 12px; }
    .next-top { display: flex; gap: 14px; align-items: center; }
    .num {
      flex: none; width: 46px; height: 46px; border-radius: 14px;
      display: grid; place-items: center; font-weight: 850; font-size: 19px;
      background: var(--coral-soft); color: var(--coral-dark);
    }
    .next-title { font-weight: 800; font-size: 17px; line-height: 1.25; }
    .next-sub { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 50px; padding: 0 20px; border-radius: 14px;
      background: var(--coral); color: #fff; font-weight: 800; font-size: 16px;
      transition: background .15s ease, transform .15s ease;
    }
    .btn:hover { background: var(--coral-dark); }
    .btn:active { transform: scale(.98); }
    .btn.full { width: 100%; }
    .btn.ghost { background: var(--card); color: var(--text); border: 1.5px solid var(--line); }
    .btn.ghost:hover { background: #FAFAFB; }
    .btn.done { background: var(--green); }
    .btn svg { width: 20px; height: 20px; }

    /* Шаги */
    .steps { display: grid; gap: 12px; }
    .step { display: flex; gap: 12px; align-items: flex-start; font-size: 14.5px; color: #3A4150; }
    .step b { color: var(--text); }
    .step-n { flex: none; width: 26px; height: 26px; border-radius: 8px; background: var(--coral); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 13px; margin-top: 1px; }

    /* Список уроков */
    .lessons { display: grid; gap: 10px; }
    .lesson-row {
      display: flex; align-items: center; gap: 14px;
      background: var(--card); border-radius: 16px; padding: 14px; box-shadow: var(--shadow);
      transition: transform .15s ease;
    }
    .lesson-row:active { transform: scale(.99); }
    .lesson-row .num { width: 40px; height: 40px; font-size: 16px; border-radius: 12px; }
    .lesson-row.is-done .num { background: var(--green-soft); color: var(--green); }
    .lesson-row.is-next .num { background: var(--coral); color: #fff; }
    .lr-main { min-width: 0; flex: 1; }
    .lr-title { font-weight: 750; font-size: 15.5px; line-height: 1.3; }
    .lr-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .chip { flex: none; font-size: 12px; font-weight: 800; padding: 4px 9px; border-radius: 99px; background: #F0F1F4; color: var(--muted); }
    .chip.ok { background: var(--green-soft); color: var(--green); }
    .chip.go { background: var(--coral-soft); color: var(--coral-dark); }

    /* План */
    .week { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 14px 16px; border: 2px solid transparent; }
    .week + .week { margin-top: 10px; }
    .week.now { border-color: var(--coral); }
    .week-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .week-h b { font-size: 15.5px; }
    .week-h span { font-size: 13px; color: var(--muted); }
    .week-now { font-size: 11.5px; font-weight: 800; color: #fff; background: var(--coral); padding: 2px 8px; border-radius: 99px; margin-left: 8px; vertical-align: 2px; }
    .week-l { margin-top: 8px; display: grid; gap: 6px; }
    .week-l a { display: flex; align-items: center; gap: 8px; font-size: 14.5px; }
    .dot { width: 10px; height: 10px; border-radius: 99px; background: #D7DAE0; flex: none; }
    .dot.ok { background: var(--green); }
    .week.final { background: var(--coral-soft); box-shadow: none; }

    /* Урок */
    .lesson-h h1 { font-size: 26px; line-height: 1.15; font-weight: 850; letter-spacing: -0.02em; }
    .player { margin-top: 16px; border-radius: var(--radius); overflow: hidden; background: #0F1115; box-shadow: var(--shadow); }
    .player video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #0F1115; }
    .player-bar { display: flex; align-items: center; gap: 6px; padding: 10px 12px; background: #171A21; color: #C9CDD6; font-size: 13px; flex-wrap: wrap; }
    .speed { padding: 5px 10px; border-radius: 99px; background: #262A33; color: #E6E8EE; font-weight: 700; font-size: 12.5px; }
    .speed.on { background: var(--coral); color: #fff; }
    .player-bar .resume { margin-left: auto; color: #9CA3AF; }
    .mat { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
    .mat a {
      display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px;
      background: var(--card); box-shadow: var(--shadow); transition: transform .15s ease;
    }
    .mat a:active { transform: scale(.98); }
    .mat-ic { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--coral-soft); color: var(--coral-dark); }
    .mat-ic svg { width: 21px; height: 21px; }
    .mat-ic.g { background: var(--green-soft); color: var(--green); }
    .mat-ic.y { background: var(--yellow-soft); color: #B07A12; }
    .mat-t { font-weight: 750; font-size: 15px; line-height: 1.25; }
    .mat-s { font-size: 12.5px; color: var(--muted); }
    .note { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--yellow-soft); font-size: 13.5px; color: #5B4A1E; }
    .mine { background: var(--coral-soft); border-radius: var(--radius); padding: 18px; }
    .mine .kicker { margin-bottom: 6px; }
    .mine p { font-size: 15px; color: #2E3340; }
    .code { margin-top: 12px; background: #fff; border-radius: 14px; padding: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; color: #2E3340; }
    .copy { margin-top: 10px; }
    .report p { font-size: 14.5px; color: #3A4150; }
    .row-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 26px; }
    .pager a { padding: 12px 14px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); font-size: 13px; color: var(--muted); }
    .pager a b { display: block; font-size: 14.5px; color: var(--text); margin-top: 2px; }
    .pager a.right { text-align: right; }

    /* Установка */
    .install { margin-top: 18px; display: flex; gap: 12px; align-items: flex-start; background: var(--card); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); }
    .install img { width: 44px; height: 44px; border-radius: 11px; flex: none; }
    .install p { font-size: 13.5px; color: #3A4150; }
    .install b { color: var(--text); }
    .install .x { margin-left: auto; color: var(--muted); font-size: 20px; line-height: 1; padding: 2px 4px; }
    .install .btn { min-height: 38px; font-size: 14px; padding: 0 14px; margin-top: 8px; }

    /* Нижняя навигация */
    .tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      background: rgba(255, 255, 255, 0.95); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tabbar-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
    .tab { display: grid; justify-items: center; gap: 2px; padding: 9px 0 8px; font-size: 11.5px; font-weight: 700; color: #9AA0AB; }
    .tab svg { width: 24px; height: 24px; }
    .tab.on { color: var(--coral); }

    .toast {
      position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); z-index: 40;
      transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
      background: var(--text); color: #fff; font-size: 14px; font-weight: 700;
      padding: 10px 16px; border-radius: 99px; transition: opacity .2s ease, transform .2s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (min-width: 720px) {
      .hero h1 { font-size: 36px; }
      .lesson-h h1 { font-size: 30px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>

  <script>
    window.COURSE = {"key": "ilvir", "kicker": "ИИ. Новая реальность · курс в записи", "brandTail": "курс ИИ", "heroTitle": "Ильвир, ваш курс", "heroLead": "8 занятий в записи, шпаргалки, практика и задания под вашу стройку. План рассчитан так, чтобы к старту AI Цеха 9 ноября вы прошли весь курс.", "deadlineShort": "до 8 ноября", "finishText": "Курс пройден. Дальше AI Цех, старт 9 ноября.", "telegram": "https://t.me/neovidaAi", "howTo": ["<b>Смотрите запись урока.<\/b> Можно на скорости 1,25 и с паузами. Открывайте ИИ рядом и повторяйте за экраном: шпаргалка идёт ровно по шагам записи.", "<b>Делайте практику урока.<\/b> Она пошаговая: что открыть, что вставить, что получится. Даты и «чат группы» в ней остались от живой группы, на них не смотрите.", "<b>Задание под вашу стройку.<\/b> Оно в конце каждого урока. Один результат на своей задаче закрепляет урок лучше, чем три просмотра.", "<b>Отчёт Альберту.<\/b> Пара строк или скрин в личку, первой строкой «#урок1» и так далее. Приложение запоминает, где вы остановились в записи."], "planTitle": "Четыре недели до AI Цеха", "planLead": "Два урока в неделю: вечер на запись, вечер на практику. Отстали, не страшно, догоняйте в выходные.", "plan": [{"name": "Неделя 1", "dates": "12–18 октября", "from": "2026-10-12", "to": "2026-10-18", "lessons": [1, 2]}, {"name": "Неделя 2", "dates": "19–25 октября", "from": "2026-10-19", "to": "2026-10-25", "lessons": [3, 4]}, {"name": "Неделя 3", "dates": "26 октября – 1 ноября", "from": "2026-10-26", "to": "2026-11-01", "lessons": [5, 6]}, {"name": "Неделя 4", "dates": "2–8 ноября", "from": "2026-11-02", "to": "2026-11-08", "lessons": [7, 8]}], "planFinal": {"name": "9 ноября, понедельник", "dates": "старт AI Цеха", "text": "Приходите с идеей своего проекта из урока 8."}, "mineTitle": "Задание под вашу стройку", "mine": {"1": {"text": "Когда в практике ИИ начнёт брать у вас интервью для досье, рассказывайте про «Феникс»: строите дома ИЖС, сколько людей в команде, кто ваши заказчики, на что уходит больше всего времени. Чем подробнее, тем точнее он будет отвечать на следующих уроках."}, "2": {"text": "Соберите по формуле смету для заказчика. Готовый запрос ниже: скопируйте, приложите свой расчёт по любому объекту и отправьте. Потом выпишите три свои рутинные задачи: что делаете, как часто, сколько времени уходит. Из них в уроке 3 соберёте ассистентов.", "prompt": "Ты сметчик, который умеет объяснять цифры человеку без строительного опыта.\n\nКонтекст: я строю дома ИЖС. Вот мой расчёт по объекту, файл приложен. Если файл не грузится, вставлю данные текстом. Кому уйдёт: заказчику, который в стройке не разбирается.\n\nЗадача: собери из расчёта версию для заказчика, после которой не спрашивают «а за что тут столько».\n\nФормат: таблица крупными блоками работ: сколько стоит, что входит, что НЕ входит. Под ней вывод на пять строк и три вопроса, которые заказчик задаст первым делом.\n\nОграничения: цифры не меняй и ничего не досчитывай, где данных нет, так и пиши. Без строительных терминов без расшифровки."}, "3": {"text": "Соберите ассистента «Смета заказчику» и обязательно с базой знаний: ваш прайс на работы и материалы, пара удачных смет, частые вопросы заказчиков. На входе обмер и пожелания, на выходе смета с вариантами и понятное письмо, после которого не спрашивают «а за что тут столько»."}, "4": {"text": "Соберите блокнот «Феникс: документы»: договор подряда, технологические карты, прайсы поставщиков, ваши регламенты. Спросите его, что по договору вы обязаны делать при задержке материалов: он ответит только по вашим файлам и покажет, откуда взял. И поставьте одну задачу по расписанию: каждый понедельник сводка цен на основные материалы."}, "5": {"text": "Первым проектом в Codex соберите калькулятор стоимости дома для заказчика: площадь, этажность, материал стен, отделка, на выходе вилка цены и смета крупными блоками. Цены ставьте свои, ИИ их не придумывает."}, "6": {"text": "Выложите калькулятор по ссылке, чтобы отправлять его клиентам до первой встречи. Из скиллов первыми ставьте те, что ложатся на ваши дела: смета, коммерческое предложение, проверка договора подряда."}, "7": {"text": "Запустите Дипресёрч по рынку ИЖС в вашем районе: цены за квадратный метр у конкурентов, что входит в их пакеты, что о них пишут в отзывах. А первого помощника заведите на проверку сметы перед отправкой заказчику: ошибки в цифрах, забытые работы, непонятные формулировки."}, "8": {"text": "Пройдите путь продукта для своего приложения, это шаг 8 шпаргалки. Берите идею, которая повторяется чаще всего и забирает больше всего времени. С ней же приходите на AI Цех 9 ноября: там вы будете делать свой проект, и с готовой идеей старт пойдёт быстрее."}}, "lessons": [{"n": 1, "title": "Погружение: навигатор по ИИ", "dur": "2 ч 11 мин", "about": "Карта инструментов: что брать под какую задачу. Настраиваем ChatGPT под себя и закрываем первые рабочие задачи.", "video": "https://172-245-142-12.nip.io/4c974d263db85f777c86/nr-kurs/urok-01.mp4", "poster": "https://172-245-142-12.nip.io/4c974d263db85f777c86/nr-kurs/urok-01.jpg", "materials": [{"title": "Презентация", "sub": "слайды урока", "href": "https://materials.neovida.ai/corp-18-08/prezentaciya.html", "icon": "slides"}, {"title": "Шпаргалка", "sub": "все промпты по шагам записи", "href": "https://materials.neovida.ai/corp-18-08/shpargalka.html", "icon": "sheet"}, {"title": "Практика", "sub": "пошагово: что открыть, что вставить", "href": "https://materials.neovida.ai/corp-18-08/domashka.html", "icon": "task"}, {"title": "Установка на iPhone", "sub": "ChatGPT и другие приложения", "href": "https://materials.neovida.ai/corp-18-08/iphone.html", "icon": "phone"}, {"title": "Установка на Android", "sub": "ChatGPT и другие приложения", "href": "https://materials.neovida.ai/corp-18-08/android.html", "icon": "phone"}], "notes": ["В практике остались даты, сроки и «чат группы» от живой группы. На них не смотрите: делайте в своём темпе, отчёт присылайте Альберту в личку."]}, {"n": 2, "title": "Промпт-ин     function toast(text) {
      const t = $('#toast');
      t.textContent = text || 'Скопировано';
      t.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => t.classList.remove('show'), 1600);
    }
    async function copy(text) {
      try { await navigator.clipboard.writeText(text); toast('Скопировано'); }
      catch (e) {
        const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); toast('Скопировано'); } catch (er) { toast('Не получилось скопировать'); }
        ta.remove();
      }
    }

    function matLink(m) {
      const [ic, cls] = MAT_ICON[m.icon] || MAT_ICON.book;
      return `<a href="${esc(m.href)}" target="_blank" rel="noopener"><span class="mat-ic ${cls}">${ICON[ic]}</span><span><span class="mat-t">${esc(m.title)}</span><br><span class="mat-s">${esc(m.sub || '')}</span></span></a>`;
    }

    function lessonRow(l) {
      const nx = nextLesson();
      const isDone = !!done[l.n], isNext = nx && nx.n === l.n;
      const chip = isDone ? '<span class="chip ok">пройден</span>' : (isNext ? '<span class="chip go">дальше</span>' : '');
      const p = pos[l.n] && !isDone ? ' · остановились на ' + fmt(pos[l.n]) : '';
      return `<a class="lesson-row ${isDone ? 'is-done' : ''} ${isNext ? 'is-next' : ''}" href="#/urok/${l.n}">
        <span class="num">${isDone ? ICON.check.replace('<svg', '<svg width="20" height="20"') : l.n}</span>
        <span class="lr-main"><span class="lr-title">${esc(l.title)}</span><br><span class="lr-sub">${esc(l.dur)}${esc(p)}</span></span>
        ${chip}
      </a>`;
    }

    function installCard() {
      const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
      if (standalone || store.get('installHidden', false)) return '';
      const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
      const how = ios
        ? 'Откройте эту страницу в Safari, нажмите «Поделиться» и выберите «На экран Домой». Курс встанет иконкой, как приложение.'
        : 'Курс можно поставить иконкой на телефон или компьютер и открывать как приложение.';
      return `<div class="install" id="install">
        <img src="icon-192.png" alt="">
        <div><p><b>Сделайте курс приложением.</b> ${esc(how)}</p>
        ${ios ? '' : '<button class="btn" id="installBtn" hidden>Установить</button>'}</div>
        <button class="x" id="installX" aria-label="Скрыть">×</button>
      </div>`;
    }

    function viewHome() {
      const n = doneCount(), total = C.lessons.length, nx = nextLesson();
      const cont = nx
        ? `<div class="card next">
            <div class="next-top"><span class="num">${nx.n}</span>
              <div><div class="next-title">${esc(nx.title)}</div>
              <div class="next-sub">${pos[nx.n] ? 'Вы остановились на ' + fmt(pos[nx.n]) : 'Урок ' + nx.n + ' из ' + total + ' · ' + esc(nx.dur)}</div></div></div>
            <a class="btn full" href="#/urok/${nx.n}">${ICON.play} ${pos[nx.n] ? 'Продолжить' : 'Смотреть урок'}</a>
          </div>`
        : `<div class="card next"><div class="next-title">Все ${total} уроков пройдены</div><div class="next-sub">${esc(C.finishText)}</div></div>`;
      const steps = C.howTo.map((s, i) => `<div class="step"><span class="step-n">${i + 1}</span><p>${s}</p></div>`).join('');
      return `<section class="screen">
        <div class="hero">
          <div class="kicker">${esc(C.kicker)}</div>
          <h1>${esc(C.heroTitle)}</h1>
          <p class="lead">${esc(C.heroLead)}</p>
          <div class="progress"><div class="progress-row"><span>Пройдено ${n} из ${total}</span><span class="muted">${esc(C.deadlineShort)}</span></div>
          <div class="bar"><i style="width:${Math.round(n / total * 100)}%"></i></div></div>
        </div>
        ${cont}
        ${installCard()}
        <div class="section"><div class="section-h"><h2>Как проходить</h2></div><div class="card steps">${steps}</div></div>
        <div class="section"><div class="section-h"><h2>Уроки</h2><span>${total} занятий в записи</span></div>
          <div class="lessons">${C.lessons.map(lessonRow).join('')}</div></div>
      </section>`;
    }

    function weekIsNow(w) {
      const t = new Date(); t.setHours(12, 0, 0, 0);
      return new Date(w.from + 'T00:00:00') <= t && t <= new Date(w.to + 'T23:59:59');
    }
    function viewPlan() {
      const weeks = C.plan.map((w) => {
        const now = weekIsNow(w);
        const items = w.lessons.map((n) => {
          const l = C.lessons.find((x) => x.n === n);
          return `<a href="#/urok/${n}"><span class="dot ${done[n] ? 'ok' : ''}"></span>Урок ${n}. ${esc(l.title)}</a>`;
        }).join('');
        return `<div class="week ${now ? 'now' : ''}"><div class="week-h"><b>${esc(w.name)}${now ? '<span class="week-now">сейчас</span>' : ''}</b><span>${esc(w.dates)}</span></div><div class="week-l">${items}</div></div>`;
      }).join('');
      const fin = C.planFinal ? `<div class="week final" style="margin-top:10px"><div class="week-h"><b>${esc(C.planFinal.name)}</b><span>${esc(C.planFinal.dates)}</span></div><p class="muted" style="margin-top:6px;font-size:14px">${esc(C.planFinal.text)}</p></div>` : '';
      return `<section class="screen">
        <div class="hero"><div class="kicker">План</div><h1>${esc(C.planTitle)}</h1><p class="lead">${esc(C.planLead)}</p></div>
        <div class="section">${weeks}${fin}</div>
      </section>`;
    }

    function viewMaterials() {
      const groups = C.materials.map((g) => `<div class="section"><div class="section-h"><h2>${esc(g.title)}</h2><span>${esc(g.sub || '')}</span></div><div class="mat">${g.items.map(matLink).join('')}</div></div>`).join('');
      return `<section class="screen">
        <div class="hero"><div class="kicker">Материалы</div><h1>Всё под рукой</h1><p class="lead">Библиотеки готовых промптов, ассистентов, навыков и ролей со всего курса. Пользуйтесь в работе и после курса.</p></div>
        ${groups}
      </section>`;
    }

    function viewLesson(n) {
      const l = C.lessons.find((x) => x.n === n);
      if (!l) return viewHome();
      const i = C.lessons.indexOf(l), prev = C.lessons[i - 1], next = C.lessons[i + 1];
      const mine = C.mine && C.mine[l.n];
      const mineBlock = mine ? `<div class="section mine">
          <div class="kicker">${esc(C.mineTitle)}</div><p>${esc(mine.text)}</p>
          ${mine.prompt ? `<div class="code">${esc(mine.prompt)}</div><button class="btn ghost full copy" data-copy="${esc(mine.prompt)}">${ICON.copy} Скопировать запрос</button>` : ''}
        </div>` : '';
      const report = `#урок${l.n}\nЧто сделал: \nЧто получилось: \nГде застрял: `;
      const notes = (l.notes || []).map((t) => `<div class="note">${esc(t)}</div>`).join('');
      return `<section class="screen">
        <div class="lesson-h"><div class="kicker">Урок ${l.n} из ${C.lessons.length} · ${esc(l.dur)}</div><h1>${esc(l.title)}</h1><p class="lead">${esc(l.about)}</p></div>
        <div class="player">
          <video id="video" controls playsinline preload="metadata" poster="${esc(l.poster)}" src="${esc(l.video)}"></video>
          <div class="player-bar">Скорость:
            ${[1, 1.25, 1.5, 2].map((s) => `<button class="speed ${s === 1 ? 'on' : ''}" data-speed="${s}">${String(s).replace('.', ',')}×</button>`).join('')}
            <span class="resume" id="resume"></span>
          </div>
        </div>
        <div class="section"><div class="section-h"><h2>Материалы урока</h2></div><div class="mat">${l.materials.map(matLink).join('')}</div>${notes}</div>
        ${mineBlock}
        <div class="section card report">
          <div class="kicker">Отчёт Альберту</div>
          <p>Прошли урок и практику, напишите Альберту в личку пару строк или пришлите скрин. Первой строкой хэштег урока.</p>
          <div class="row-btns">
            <button class="btn ghost" data-copy="${esc(report)}">${ICON.copy} Шаблон</button>
            <a class="btn ghost" href="${esc(C.telegram)}" target="_blank" rel="noopener">${ICON.send} Написать</a>
          </div>
        </div>
        <div class="section"><button class="btn full ${done[l.n] ? 'done' : ''}" id="doneBtn">${done[l.n] ? ICON.check + ' Урок пройден' : 'Отметить урок пройденным'}</button></div>
        <div class="pager">
          ${prev ? `<a href="#/urok/${prev.n}">← Урок ${prev.n}<b>${esc(prev.title)}</b></a>` : '<span></span>'}
          ${next ? `<a class="right" href="#/urok/${next.n}">Урок ${next.n} →<b>${esc(next.title)}</b></a>` : '<span></span>'}
        </div>
      </section>`;
    }

    function bindLesson(n) {
      const v = $('#video'), r = $('#resume');
      if (!v) return;
      let lastSave = 0;
      v.addEventListener('loadedmetadata', () => {
        const p = pos[n] || 0;
        if (p > 30 && p < v.duration - 60) { v.currentTime = p; r.textContent = 'продолжаем с ' + fmt(p); }
      }, { once: true });
      const save = () => { pos[n] = Math.floor(v.currentTime); store.set('pos', pos); };
      v.addEventListener('timeupdate', () => { const t = Date.now(); if (t - lastSave > 5000) { lastSave = t; save(); } });
      v.addEventListener('pause', save);
      v.addEventListener('ended', () => { pos[n] = 0; store.set('pos', pos); toast('Запись досмотрена. Теперь практика'); });
      document.querySelectorAll('[data-speed]').forEach((b) => b.addEventListener('click', () => {
        v.playbackRate = Number(b.dataset.speed);
        document.querySelectorAll('[data-speed]').forEach((x) => x.classList.toggle('on', x === b));
      }));
      $('#doneBtn').addEventListener('click', (e) => {
        done[n] = !done[n]; if (!done[n]) delete done[n];
        store.set('done', done);
        const b = e.currentTarget;
        b.classList.toggle('done', !!done[n]);
        b.innerHTML = done[n] ? ICON.check + ' Урок пройден' : 'Отметить урок пройденным';
        $('#topbar').innerHTML = topbar(parse());
        if (done[n]) toast('Отлично, урок ' + n + ' пройден');
      });
    }

    function topbar(route) {
      if (route.name === 'lesson') return `<a class="back" href="#/">${ICON.back} Уроки</a><span class="topbar-right">${doneCount()} из ${C.lessons.length}</span>`;
      return `<span class="brand"><b>neovida</b>.ai · ${esc(C.brandTail)}</span><span class="topbar-right">${doneCount()} из ${C.lessons.length}</span>`;
    }
    function tabbar(route) {
      const tabs = [['home', '#/', 'Уроки', ICON.grid], ['plan', '#/plan', 'План', ICON.cal], ['mat', '#/materialy', 'Материалы', ICON.book]];
      const active = route.name === 'lesson' ? 'home' : route.name;
      return tabs.map(([k, h, t, ic]) => `<a class="tab ${active === k ? 'on' : ''}" href="${h}">${ic}<span>${t}</span></a>`).join('');
    }

    function parse() {
      const h = location.hash.replace(/^#/, '');
      const m = h.match(/^\/urok\/(\d+)/);
      if (m) return { name: 'lesson', n: Number(m[1]) };
      if (h.startsWith('/plan')) return { name: 'plan' };
      if (h.startsWith('/materialy')) return { name: 'mat' };
      return { name: 'home' };
    }

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; const b = $('#installBtn'); if (b) b.hidden = false; });

    function render() {
      const route = parse();
      $('#topbar').innerHTML = topbar(route);
      $('#tabbar').innerHTML = tabbar(route);
      const view = $('#view');
      view.innerHTML = route.name === 'lesson' ? viewLesson(route.n) : route.name === 'plan' ? viewPlan() : route.name === 'mat' ? viewMaterials() : viewHome();
      document.querySelectorAll('[data-copy]').forEach((b) => b.addEventListener('click', () => copy(b.getAttribute('data-copy'))));
      if (route.name === 'lesson') bindLesson(route.n);
      const x = $('#installX'); if (x) x.addEventListener('click', () => { store.set('installHidden', true); $('#install').remove(); });
      const ib = $('#installBtn'); if (ib) { ib.hidden = !deferredPrompt; ib.addEventListener('click', async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); deferredPrompt = null; ib.hidden = true; }); }
    }

    let lastRoute = '';
    window.addEventListener('hashchange', () => {
      if (location.hash !== lastRoute) window.scrollTo(0, 0);
      lastRoute = location.hash;
      render();
    });
    lastRoute = location.hash;
    render();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
    }
  })();
  </script>
</body>
</html>
