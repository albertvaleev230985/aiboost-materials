    @media (prefers-reduced-motion: reduce) {

    }

          <span class="num">${l.n}</span>
          <span class="lr-main"><span class="lr-title">${esc(l.title)}</span><br><span class="lr-sub">Откроется после занятия группы</span></span>
          <span class="chip">${esc(l.soon)}</span>
        </a>`;
      }
      const nx = nextLesson();
      const isDone = !!done[l.n], isNext = nx && nx.n === l.n;
      const chip = isDone ? '<span class="chip ok">пройден</span>' : (isNext ? '<span class="chip go">дальше</span>' : '');
      const p = pos[l.n] && !isDone ? ' · остановились на ' + fmt(pos[l.n]) : '';
      return `<a class="lesson-row ${isDone ? 'is-done' : ''} ${isNext ? 'is-next' : ''}" href="#/urok/${l.n}">
        <span class="num">${isDone ? ICON.check.replace('<svg', '<svg width="20" height="20"') : l.n}</span>
        <span class="lr-main"><span class="lr-title">${esc(l.title)}</span><br><span class="lr-sub">${esc(l.dur)}${esc(p)}</span></span>
        ${chip}
      </a>`;
    }

    function installCard() {
      const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
      if (standalone || store.get('installHidden', false)) return '';
      const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
      const how = ios ? UI.installIos : UI.installOther;
      return `<div class="install" id="install">
        <img src="icon-192.png" alt="">
        <div><p><b>${esc(UI.installTitle)}</b> ${esc(how)}</p>
        ${ios ? '' : '<button class="btn" id="installBtn" hidden>Установить</button>'}</div>
        <button class="x" id="installX" aria-label="Скрыть">×</button>
      </div>`;
    }

    function viewHome() {
      const n = doneCount(), total = C.lessons.length, nx = nextLesson(), soon = firstSoon();
      const opened = C.lessons.filter(isOpen).length;
      const cont = nx
        ? `<div class="card next">
            <div class="next-top"><span class="num">${nx.n}</span>
              <div><div class="next-title">${esc(nx.title)}</div>
              <div class="next-sub">${pos[nx.n] ? esc(UI.stoppedAt) + fmt(pos[nx.n]) : 'Урок ' + nx.n + ' из ' + total + ' · ' + esc(nx.dur)}</div></div></div>
            <a class="btn full" href="#/urok/${nx.n}">${ICON.play} ${pos[nx.n] ? 'Продолжить' : 'Смотреть урок'}</a>
          </div>`
        : soon
          ? `<div class="card next"><div class="next-title">${esc(UI.caughtUp)}</div><div class="next-sub">Урок ${soon.n}, ${esc(soon.title)}, появится здесь после занятия группы ${esc(soon.soonLong)}.</div></div>`
          : `<div class="card next"><div class="next-title">Все ${total} уроков пройдены</div><div class="next-sub">${esc(C.finishText)}</div></div>`;
      const steps = C.howTo.map((s, i) => `<div class="step"><span class="step-n">${i + 1}</span><p>${s}</p></div>`).join('');
      return `<section class="screen">
        <div class="hero">
          <div class="kicker">${esc(C.kicker)}</div>
          <h1>${esc(C.heroTitle)}</h1>
          <p class="lead">${esc(C.heroLead)}</p>
          ${C.accessUntilText ? `<p class="access">Доступ к курсу открыт до ${esc(C.accessUntilText)}</p>` : ''}
          <div class="progress"><div class="progress-row"><span>Пройдено ${n} из ${total}</span><span class="muted">${esc(C.deadlineShort)}</span></div>
          <div class="bar"><i style="width:${Math.round(n / total * 100)}%"></i></div></div>
        </div>
        ${cont}
        ${installCard()}
        <div class="section"><div class="section-h"><h2>Как проходить</h2></div><div class="card steps">${steps}</div></div>
        <div class="section"><div class="section-h"><h2>Уроки</h2><span>${opened < total ? 'вышло ' + opened + ' из ' + total : total + ' занятий в записи'}</span></div>
          <div class="lessons">${C.lessons.map(lessonRow).join('')}</div></div>
      </section>`;
    }

    function weekIsNow(w) {
      const t = new Date(); t.setHours(12, 0, 0, 0);
      return new Date(w.from + 'T00:00:00') <= t && t <= new Date(w.to + 'T23:59:59');
    }
    function viewPlan() {
      const weeks = C.plan.map((w) => {
        const now = weekIsNow(w);
        const items = w.lessons.map((n) => {
          const l = C.lessons.find((x) => x.n === n);
          return `<a href="#/urok/${n}"><span class="dot ${done[n] ? 'ok' : ''}"></span><span>Урок ${n}. ${esc(l.title)}${isOpen(l) ? '' : ` <span class="muted">· выйдет ${esc(l.soon)}</span>`}</span></a>`;
        }).join('');
        return `<div class="week ${now ? 'now' : ''}"><div class="week-h"><b>${esc(w.name)}${now ? '<span class="week-now">сейчас</span>' : ''}</b><span>${esc(w.dates)}</span></div><div class="week-l">${items}</div></div>`;
      }).join('');
      const fin = C.planFinal ? `<div class="week final" style="margin-top:10px"><div class="week-h"><b>${esc(C.planFinal.name)}</b><span>${esc(C.planFinal.dates)}</span></div><p class="muted" style="margin-top:6px;font-size:14px">${esc(C.planFinal.text)}</p></div>` : '';
      return `<section class="screen">
        <div class="hero"><div class="kicker">План</div><h1>${esc(C.planTitle)}</h1><p class="lead">${esc(C.planLead)}</p></div>
        <div class="section">${weeks}${fin}</div>
      </section>`;
    }

    function viewMaterials() {
      const groups = C.materials.map((g) => `<div class="section"><div class="section-h"><h2>${esc(g.title)}</h2><span>${esc(g.sub || '')}</span></div><div class="mat">${g.items.map(matLink).join('')}</div></div>`).join('');
      return `<section class="screen">
        <div class="hero"><div class="kicker">Материалы</div><h1>Всё под рукой</h1><p class="lead">${esc(UI.materialsLead)}</p></div>
        ${groups}
      </section>`;
    }

    function viewLesson(n) {
      const l = C.lessons.find((x) => x.n === n);
      if (!l) return viewHome();
      const i = C.lessons.indexOf(l), prev = C.lessons[i - 1], next = C.lessons[i + 1];
      const pager = `<div class="pager">
          ${prev ? `<a href="#/urok/${prev.n}">← Урок ${prev.n}<b>${esc(prev.title)}</b></a>` : '<span></span>'}
          ${next ? `<a class="right" href="#/urok/${next.n}">Урок ${next.n} →<b>${esc(next.title)}</b></a>` : '<span></span>'}
        </div>`;
      if (!isOpen(l)) {
        return `<section class="screen">
          <div class="lesson-h"><div class="kicker">Урок ${l.n} из ${C.lessons.length} · скоро</div><h1>${esc(l.title)}</h1><p class="lead">${esc(l.about)}</p></div>
          <div class="soon-card"><b>Занятие группы ${esc(l.soonLong)}</b>${esc(UI.soonText)}</div>
          ${pager}
        </section>`;
      }
      const player = l.zoom
        ? `<div class="player"><div class="zoom-in"><p>${esc(UI.zoomText)}</p><p class="code-line">Код: <b>${esc(l.zoom.code)}</b></p>
            <div class="row-btns"><a class="btn" href="${esc(l.zoom.url)}" target="_blank" rel="noopener">${ICON.play} Открыть запись</a>
            <button class="btn ghost" data-copy="${esc(l.zoom.code)}">${ICON.copy} Скопировать код</button></div></div></div>`
        : `<div class="player">
          <video id="video" controls playsinline preload="metadata" poster="${esc(l.poster)}" src="${esc(l.video)}"></video>
          <div class="player-bar">Скорость:
            ${[1, 1.25, 1.5, 2].map((s) => `<button class="speed ${s === 1 ? 'on' : ''}" data-speed="${s}">${String(s).replace('.', ',')}×</button>`).join('')}
            <span class="resume" id="resume"></span>
          </div>
        </div>`;
      const mine = C.mine && C.mine[l.n];
      const mineBlock = mine ? `<div class="section mine">
          <div class="kicker">${esc(C.mineTitle)}</div><p>${esc(mine.text)}</p>
          ${mine.prompt ? `<div class="code">${esc(mine.prompt)}</div><button class="btn ghost full copy" data-copy="${esc(mine.prompt)}">${ICON.copy} Скопировать запрос</button>` : ''}
        </div>` : '';
      const report = `#урок${l.n}\n` + UI.reportTpl;
      const notes = (l.notes || []).map((t) => `<div class="note">${esc(t)}</div>`).join('');
      return `<section class="screen">
        <div class="lesson-h"><div class="kicker">Урок ${l.n} из ${C.lessons.length} · ${esc(l.dur)}</div><h1>${esc(l.title)}</h1><p class="lead">${esc(l.about)}</p></div>
        ${player}
        <div class="section"><div class="section-h"><h2>Материалы урока</h2></div><div class="mat">${l.materials.map(matLink).join('')}</div>${notes}</div>
        ${mineBlock}
        <div class="section card report">
          <div class="kicker">Отчёт Альберту</div>
          <p>${esc(UI.reportText)}</p>
          <div class="code">${esc(report)}</div>
          <div class="row-btns">
            <button class="btn ghost" data-copy="${esc(report)}">${ICON.copy} Шаблон</button>
            <a class="btn ghost" href="${esc(C.telegram)}" target="_blank" rel="noopener">${ICON.send} Написать</a>
          </div>
        </div>
        <div class="section"><button class="btn full ${done[l.n] ? 'done' : ''}" id="doneBtn">${done[l.n] ? ICON.check + ' Урок пройден' : 'Отметить урок пройденным'}</button></div>
        ${pager}
      </section>`;
    }

    function bindLesson(n) {
      const db = $('#doneBtn');
      if (db) db.addEventListener('click', (e) => {
        done[n] = !done[n]; if (!done[n]) delete done[n];
        store.set('done', done);
        const b = e.currentTarget;
        b.classList.toggle('done', !!done[n]);
        b.innerHTML = done[n] ? ICON.check + ' Урок пройден' : 'Отметить урок пройденным';
        $('#topbar').innerHTML = topbar(parse());
        if (done[n]) toast('Отлично, урок ' + n + ' пройден');
      });
      const v = $('#video'), r = $('#resume');
      if (!v) return;
      let lastSave = 0;
      v.addEventListener('loadedmetadata', () => {
        const p = pos[n] || 0;
        if (p > 30 && p < v.duration - 60) { v.currentTime = p; r.textContent = 'продолжаем с ' + fmt(p); }
      }, { once: true });
      const save = () => { pos[n] = Math.floor(v.currentTime); store.set('pos', pos); };
      v.addEventListener('timeupdate', () => { const t = Date.now(); if (t - lastSave > 5000) { lastSave = t; save(); } });
      v.addEventListener('pause', save);
      v.addEventListener('ended', () => { pos[n] = 0; store.set('pos', pos); toast('Запись досмотрена. Теперь практика'); });
      document.querySelectorAll('[data-speed]').forEach((b) => b.addEventListener('click', () => {
        v.playbackRate = Number(b.dataset.speed);
        document.querySelectorAll('[data-speed]').forEach((x) => x.classList.toggle('on', x === b));
      }));
    }

    function topbar(route) {
      if (route.name === 'lesson') return `<a class="back" href="#/">${ICON.back} Уроки</a><span class="topbar-right">${doneCount()} из ${C.lessons.length}</span>`;
      return `<span class="brand"><b>neovida</b>.ai · ${esc(C.brandTail)}</span><span class="topbar-right">${doneCount()} из ${C.lessons.length}</span>`;
    }
    function tabbar(route) {
      const tabs = [['home', '#/', 'Уроки', ICON.grid], ['plan', '#/plan', 'План', ICON.cal], ['mat', '#/materialy', 'Материалы', ICON.book]];
      const active = route.name === 'lesson' ? 'home' : route.name;
      return tabs.map(([k, h, t, ic]) => `<a class="tab ${active === k ? 'on' : ''}" href="${h}">${ic}<span>${t}</span></a>`).join('');
    }

    function parse() {
      const h = location.hash.replace(/^#/, '');
      const m = h.match(/^\/urok\/(\d+)/);
      if (m) return { name: 'lesson', n: Number(m[1]) };
      if (h.startsWith('/plan')) return { name: 'plan' };
      if (h.startsWith('/materialy')) return { name: 'mat' };
      return { name: 'home' };
    }

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; const b = $('#installBtn'); if (b) b.hidden = false; });

    function isExpired() {
      return !!C.accessUntil && new Date() > new Date(C.accessUntil + 'T23:59:59');
    }
    function viewExpired() {
      return `<section class="screen">
        <div class="hero"><div class="kicker">${esc(C.kicker)}</div><h1>Доступ к курсу закончился</h1>
        <p class="lead">Курс был открыт до ${esc(C.accessUntilText)}. Чтобы продлить доступ, напишите Альберту.</p></div>
        <div class="section"><a class="btn full" href="${esc(C.telegram)}" target="_blank" rel="noopener">${ICON.send} Написать Альберту</a></div>
      </section>`;
    }

    function render() {
      if (isExpired()) {
        $('#topbar').innerHTML = `<span class="brand"><b>neovida</b>.ai · ${esc(C.brandTail)}</span>`;
        $('#tabbar').innerHTML = '';
        $('#view').innerHTML = viewExpired();
        return;
      }
      const route = parse();
      $('#topbar').innerHTML = topbar(route);
      $('#tabbar').innerHTML = tabbar(route);
      const view = $('#view');
      view.innerHTML = route.name === 'lesson' ? viewLesson(route.n) : route.name === 'plan' ? viewPlan() : route.name === 'mat' ? viewMaterials() : viewHome();
      document.querySelectorAll('[data-copy]').forEach((b) => b.addEventListener('click', () => copy(b.getAttribute('data-copy'))));
      if (route.name === 'lesson') bindLesson(route.n);
      const x = $('#installX'); if (x) x.addEventListener('click', () => { store.set('installHidden', true); $('#install').remove(); });
      const ib = $('#installBtn'); if (ib) { ib.hidden = !deferredPrompt; ib.addEventListener('click', async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); deferredPrompt = null; ib.hidden = true; }); }
    }

    let lastRoute = '';
    window.addEventListener('hashchange', () => {
      if (location.hash !== lastRoute) window.scrollTo(0, 0);
      lastRoute = location.hash;
      render();
    });
    lastRoute = location.hash;
    render();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
    }
  })();
  </script>
</body>
</html>
