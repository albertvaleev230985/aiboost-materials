<!doctype html>
<html><head><meta charset="utf-8"><title>inspect</title>
<style>body{font-family:monospace;font-size:11px;background:#111;color:#eee;padding:16px;line-height:1.5}pre{white-space:pre-wrap;word-break:break-all;background:#000;padding:10px;border-radius:6px;margin:8px 0}h2{color:#e85b3e;font-size:13px}</style>
</head><body>
<div id="out">loading iframe...</div>
<iframe id="ifr" src="iiskra.html?inspect=1" style="position:fixed;top:0;left:-9999px;width:1200px;height:8000px;border:0"></iframe>
<script>
document.getElementById('ifr').addEventListener('load', () => {
  setTimeout(() => {
    const doc = document.getElementById('ifr').contentDocument;
    const out = document.getElementById('out');
    const parts = [];
    function rectOf(el) { const r = el.getBoundingClientRect(); return { w: Math.round(r.width), h: Math.round(r.height) }; }
    function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    const cards = Array.from(doc.querySelectorAll('[data-lesson]'));
    parts.push('<h2>cards with data-lesson: ' + cards.length + '</h2>');
    cards.forEach(c => {
      const back = c.querySelector('.lm-back') ? 'YES' : 'NO';
      const style = doc.defaultView.getComputedStyle(c);
      parts.push('<pre>lesson=' + c.dataset.lesson + ' rect=' + JSON.stringify(rectOf(c)) + ' back=' + back + '\nborder=' + style.borderColor + ' animation=' + style.animationName + '\nhtml: ' + esc(c.outerHTML.replace(/\s+/g,' ').slice(0, 300)) + '</pre>');
    });

    out.innerHTML = parts.join('');
    document.title = 'INSPECT_DONE_' + cards.length;
  }, 2000);
});
</script>
</body></html>
