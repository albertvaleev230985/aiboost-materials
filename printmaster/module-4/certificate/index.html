<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сертификат · AI Boost для PrintMaster</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f3f0ea;
    color: #0f172a;
  }
  .box {
    width: min(520px, calc(100vw - 32px));
    background: #fffdf8;
    border: 1px solid #e2d7c8;
    border-radius: 18px;
    padding: 28px;
    box-shadow: 0 24px 80px rgba(15, 23, 42, .14);
  }
  .kicker {
    color: #0f766e;
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
    font-size: 12px;
    margin-bottom: 10px;
  }
  h1 {
    margin: 0 0 14px;
    font-size: 34px;
    line-height: 1.05;
  }
  p {
    margin: 0 0 22px;
    color: #475569;
    line-height: 1.55;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 800;
    margin-bottom: 8px;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    padding: 14px 16px;
    font: inherit;
    margin-bottom: 14px;
  }
  button {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 14px 16px;
    font: inherit;
    font-weight: 800;
    color: #fff;
    background: linear-gradient(135deg, #B76E2E, #0F766E);
    cursor: pointer;
  }
</style>
</head>
<body>
  <main class="box">
    <div class="kicker">neovida · AI Boost</div>
    <h1>Сертификат PrintMaster</h1>
    <p>Введите имя и фамилию так, как они должны выглядеть на сертификате. PDF скачивается на следующем экране.</p>
    <form id="form">
      <label for="name">Имя и фамилия</label>
      <input id="name" name="name" placeholder="Иван Иванов" autocomplete="name" required>
      <button type="submit">Открыть сертификат</button>
    </form>
  </main>
  <script>
    document.getElementById('form').addEventListener('submit', (event) => {
      event.preventDefault();
      const name = document.getElementById('name').value.trim().replace(/\s+/g, ' ');
      if (!name) return;
      location.href = 'live.html?name=' + encodeURIComponent(name);
    });
  </script>
</body>
</html>
