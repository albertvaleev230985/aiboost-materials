<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Boost · PrintMaster · итоговый мини-отчёт</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body class="app">

<header class="app-header" id="app-header"></header>

<main class="wrap">
  <div id="content"></div>
</main>

<script type="module">
import { renderHeader, getMe, debounce, runTimer, triggerCelebration, certificateScreenHTML } from './app.js';
import { subscribeSession, pushCard } from './firebase.js';

const me = getMe();
renderHeader(me, { showLogout: true });
if (!me) {
  document.querySelector('.wrap').innerHTML = `
    <div class="card outline-coral">
      <div class="card-tag coral">Нужно войти</div>
      <div class="card-title">Сначала введи имя и&nbsp;фамилию</div>
      <div class="card-body">Открой <a href="index.html" class="highlight-violet">страницу входа</a>.</div>
    </div>`;
  throw new Error('no me');
}

const content = document.getElementById('content');
let session = { phase: 'lobby' };
let stopTimer = null;

const storageBase = 'aiboost_printmaster_m4:' + me.slug + ':card:';
const fields = [
  {
    key: 'madeAssistants',
    label: 'Какие Gems / ассистенты уже сделал(а)',
    hint: 'Укажи название каждого Gem или ассистента, для какого рабочего процесса он создан и что уже умеет делать.',
    placeholder: 'Например:\nGem: Помощник по КП PrintMaster.\nПроцесс: подготовка черновика КП по входящей заявке.\nЧто делает: задаёт уточняющие вопросы, собирает структуру КП, готовит черновик письма клиенту.\nБаза знаний: шаблон КП, FAQ по услугам, прайс.\nСтатус: протестировал(а) на 2 заявках, нужно добавить свежий прайс.',
  },
  {
    key: 'canvasTool',
    label: 'Какой Canvas / мини-инструмент сделал(а) или хочу сделать',
    hint: 'Если Canvas уже есть, опиши его. Если пока нет, напиши, какой небольшой рабочий инструмент нужен: форма, чек-лист, калькулятор, таблица ввода.',
    placeholder: 'Например:\nCanvas: чек-лист входящей заявки.\nЗачем: быстро понять, хватает ли данных для КП.\nЧто вводим: тип задачи, размеры, материалы, сроки, вводные клиента.\nЧто получаем: список недостающих данных и готовые вопросы клиенту.\nСтатус: черновик есть / хочу собрать в июне.',
  },
  {
    key: 'automatedProcesses',
    label: 'Какие процессы уже начал(а) автоматизировать через ИИ',
    hint: 'Пиши не “пользуюсь ChatGPT”, а конкретные процессы: что раньше делалось вручную и что теперь отдаётся ассистенту, Gem, NotebookLM или Canvas.',
    placeholder: 'Например:\n1. Входящие заявки клиентов — через Gem, который уточняет вводные и готовит структуру ответа.\n2. Поиск ответов в документах — через NotebookLM с регламентами.\n3. Проверка комплектности данных — через Canvas-чек-лист.',
  },
  {
    key: 'juneUsage',
    label: 'Как буду использовать это в июне',
    hint: 'Выбери 1-3 рабочих процесса, которые реально начнёшь вести через ИИ регулярно. Руководителю важно увидеть план применения, а не обещание “буду пользоваться”.',
    placeholder: 'Например:\n1. Каждую новую заявку прогонять через Gem «Помощник по КП».\n2. Раз в неделю обновлять базу знаний свежими прайсами и типовыми ответами.\n3. Перед отправкой клиенту проверять письмо через ассистента на полноту и понятность.',
  },
  {
    key: 'supportNeeded',
    label: 'Что нужно, чтобы внедрение заработало стабильно',
    hint: 'Материалы, доступы, база знаний, владелец процесса, решение руководителя, тестовые кейсы, срок пересмотра. Всё, что поможет довести инструмент до рабочего стандарта.',
    placeholder: 'Например:\nНужно: свежий прайс, 5 хороших КП, FAQ по типовым вопросам, папка в Drive, ответственный за обновление базы, 3 тестовые заявки для проверки качества.',
  },
  {
    key: 'mainImplementation',
    label: 'Главный процесс, который автоматизирую через ассистента',
    hint: 'Это поле попадёт в общий отчёт для руководителя. Опиши один самый важный процесс: ассистент/Gem, старый способ, новый способ, эффект, экономия времени, что докрутить.',
    placeholder: 'Процесс: подготовка черновика КП.\nАссистент/Gem: «Помощник по КП PrintMaster».\nКак раньше: вручную собирал(а) структуру из старых КП и прайса.\nКак теперь: вставляю заявку в Gem, он задаёт вопросы, собирает структуру КП и письмо клиенту.\nРезультат: меньше пропущенных вводных, быстрее первый черновик.\nЭкономия: примерно 30 минут на КП.\nЧто доработать: загрузить свежий прайс, 5 хороших КП, FAQ по услугам.\nКак буду использовать в июне: прогонять через Gem каждую новую входящую заявку.',
  },
  {
    key: 'courseFeedback',
    label: 'Короткая обратная связь по обучению',
    hint: 'Одним абзацем: что было полезно, что осталось непонятно, какие темы стоит разобрать глубже.',
    placeholder: 'Например: полезнее всего были Gems и база знаний; нужно глубже разобрать связку NotebookLM + Drive; хотелось бы больше примеров по моему отделу.',
  },
];

const card = Object.fromEntries(fields.map(f => [f.key, localStorage.getItem(storageBase + f.key) || '']));

subscribeSession((s) => { session = s || session; render(); });

function render() {
  if (session.phase === 'certificate') {
    if (stopTimer) { stopTimer(); stopTimer = null; }
    content.innerHTML = `<div class="card outline-violet">${certificateScreenHTML(me.name)}</div>`;
    requestAnimationFrame(() => triggerCelebration());
    return;
  }

  const filledCount = fields.filter(f => card[f.key].trim()).length;
  const phase = session.phase;
  const phaseHint =
    phase === 'card' ? `<div class="card-tag violet">Сейчас</div><div class="card-body">Альберт запустил карту внедрения. Пишите конкретно: какие Gems/ассистенты собраны, какой Canvas нужен, какие процессы автоматизируете и как будете использовать это в июне.</div>` :
    phase === 'done' ? `<div class="card-tag green">Спасибо</div><div class="card-body">Урок завершён. Карта внедрения сохранена.</div>` :
    `<div class="card-tag gold">Можно начать заранее</div><div class="card-body">Карта откроется после теста. Можно заполнить черновик сейчас и&nbsp;дополнить после разбора.</div>`;

  const filledStatus = filledCount === fields.length
    ? '<i class="ph ph-check-circle icon-green"></i> Все поля заполнены — сохранено'
    : `Заполнено: ${filledCount}/${fields.length}`;

  content.innerHTML = `
    <div class="h1">Моя карта AI-внедрения</div>
    <div class="lead">Фиксируем не впечатления, а рабочие инструменты: какие Gems/ассистенты и Canvas вы собрали, какие процессы переводите в ИИ и что берёте в июнь.</div>

    <div class="card" style="margin-bottom:18px;">${phaseHint}</div>

    ${phase === 'card' && session.timerStartedAt ? `
      <div class="timer-text"><span>До&nbsp;конца тихой работы</span><span class="left" id="timer-left">${session.timerDurationSec || 600} сек</span></div>
      <div class="timer-bar"><div class="fill" id="timer-fill"></div></div>
    ` : ''}

    <div class="card outline-violet">
      ${fields.map((f, idx) => `
        <div class="field" ${idx === fields.length - 1 ? 'style="margin-bottom:0;"' : ''}>
          <label class="field-label" for="f-${f.key}"><span class="field-num">${idx + 1}</span> ${f.label}</label>
          <div class="field-hint">${f.hint}</div>
          <textarea id="f-${f.key}" placeholder="${escapeHtml(f.placeholder)}">${escapeHtml(card[f.key])}</textarea>
        </div>
      `).join('')}
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:18px; flex-wrap:wrap; gap:10px;">
      <div class="muted small" id="save-hint">${filledStatus}</div>
      <a href="test.html" class="btn btn-ghost"><i class="ph ph-arrow-left"></i> Назад к тесту</a>
    </div>
  `;

  const inputs = Object.fromEntries(fields.map(f => [f.key, document.getElementById('f-' + f.key)]));
  const onInput = debounce(() => persist(), 500);
  Object.entries(inputs).forEach(([key, el]) => {
    el.addEventListener('input', () => {
      card[key] = el.value;
      localStorage.setItem(storageBase + key, el.value);
      const hint = document.getElementById('save-hint');
      if (hint) hint.innerHTML = '<i class="ph ph-cloud-arrow-up icon-violet"></i> Сохраняем…';
      onInput();
    });
  });

  if (stopTimer) { stopTimer(); stopTimer = null; }
  if (phase === 'card' && session.timerStartedAt) {
    const fill = document.getElementById('timer-fill');
    const left = document.getElementById('timer-left');
    if (fill && left) {
      stopTimer = runTimer(session.timerStartedAt, session.timerDurationSec || 600, (rem, frac) => {
        fill.style.width = (frac * 100) + '%';
        left.textContent = formatTime(rem);
        fill.className = 'fill' + (rem < 45 ? ' danger' : rem < 90 ? ' warn' : '');
      }, () => {
        const hint = document.getElementById('save-hint');
        if (hint) hint.innerHTML = '<i class="ph ph-alarm icon-coral"></i> Время вышло — мини-отчёт сохранён.';
        persist();
      });
    }
  }
}

function persist() {
  const filledCount = fields.filter(f => card[f.key].trim()).length;
  pushCard(me.slug, {
    ...card,
    filledCount,
    totalFields: fields.length,
    done: filledCount === fields.length,
    ts: Date.now(),
  }).then(() => {
    const hint = document.getElementById('save-hint');
    if (hint) hint.innerHTML = filledCount === fields.length
      ? '<i class="ph ph-check-circle icon-green"></i> Все поля заполнены — сохранено'
      : `Заполнено: ${filledCount}/${fields.length} — сохранено`;
  }).catch(e => {
    console.warn('push card failed', e);
    const hint = document.getElementById('save-hint');
    if (hint) hint.innerHTML = '<i class="ph ph-warning icon-coral"></i> Сетевая ошибка — данные в браузере, попробуем ещё раз через 5 сек.';
    setTimeout(persist, 5000);
  });
}

function formatTime(sec) {
  const m = Math.floor(sec / 60); const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2,'0')}`;
}
function escapeHtml(s) { return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>

</body>
</html>
