<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Boost · PrintMaster · итоговый мини-отчёт</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body class="app">

<header class="app-header" id="app-header"></header>

<main class="wrap">
  <div id="content"></div>
</main>

<script type="module">
import { renderHeader, getMe, debounce, runTimer, triggerCelebration, certificateScreenHTML } from './app.js';
import { subscribeSession, pushCard } from './firebase.js';

const me = getMe();
renderHeader(me, { showLogout: true });
if (!me) {
  document.querySelector('.wrap').innerHTML = `
    <div class="card outline-coral">
      <div class="card-tag coral">Нужно войти</div>
      <div class="card-title">Сначала введи имя и&nbsp;фамилию</div>
      <div class="card-body">Открой <a href="index.html" class="highlight-violet">страницу входа</a>.</div>
    </div>`;
  throw new Error('no me');
}

const content = document.getElementById('content');
let session = { phase: 'lobby' };
let stopTimer = null;

const storageBase = 'aiboost_printmaster_m4:' + me.slug + ':card:';
const fields = [
  {
    key: 'feedbackUseful',
    label: 'Что было полезно',
    hint: 'Коротко: какие темы, инструменты или форматы занятий реально помогли в работе.',
    placeholder: 'Например: Gems под повторяющиеся задачи, база знаний, Canvas для быстрых рабочих инструментов, разбор промптов на реальных процессах.',
  },
  {
    key: 'feedbackImprove',
    label: 'Что было непонятно или что нужно разобрать глубже',
    hint: 'Сюда же можно написать, что улучшить в следующих потоках обучения.',
    placeholder: 'Например: больше живых примеров по моему отделу; отдельно разобрать базы знаний; больше времени на тестирование Gem.',
  },
  {
    key: 'triedAutomations',
    label: 'Что уже пробовал(а) автоматизировать через ИИ',
    hint: 'Перечисли реальные задачи: тексты, отчёты, таблицы, письма, инструкции, регламенты, клиентские ответы, анализ данных, поиск ошибок, презентации, обработка информации.',
    placeholder: 'Например: письма клиентам, черновик инструкции, проверка таблицы, структура КП, разбор входящей заявки, подготовка тезисов для презентации.',
  },
  {
    key: 'testedImplementation',
    label: 'Что уже получилось внедрить или протестировать',
    hint: 'Не нужна идеальность. Важна реальная попытка применения: что сделали, на чём проверили, какой результат увидели.',
    placeholder: 'Например: протестировал(а) Gem на 3 заявках; Canvas-чек-лист нашёл пропущенные данные; NotebookLM помог быстрее найти ответ в документах.',
  },
  {
    key: 'juneTasks',
    label: 'Что буду применять в июне в своей должности',
    hint: '1-3 конкретные задачи, которые ты уже готов(а) делать с помощью ИИ регулярно.',
    placeholder: 'Например: каждую новую заявку прогонять через Gem; раз в неделю обновлять базу знаний; готовить черновики ответов клиентам через ИИ и проверять вручную.',
  },
  {
    key: 'teamScenario',
    label: 'Один сценарий для общего списка внедрений команды',
    hint: 'Заполни по структуре: задача; как раньше делали; как теперь через ИИ; результат; сколько времени экономится; что нужно доработать.',
    placeholder: 'Задача: подготовка черновика КП.\nРаньше: собирал(а) вручную из прайса и старых примеров.\nТеперь: Gem задаёт вопросы, собирает структуру, проверяет по базе.\nРезультат: черновик быстрее и меньше пропусков.\nЭкономия: примерно 30 минут на КП.\nДоработать: добавить свежий прайс и 5 хороших примеров.',
  },
];

const card = Object.fromEntries(fields.map(f => [f.key, localStorage.getItem(storageBase + f.key) || '']));

subscribeSession((s) => { session = s || session; render(); });

function render() {
  if (session.phase === 'certificate') {
    if (stopTimer) { stopTimer(); stopTimer = null; }
    content.innerHTML = `<div class="card outline-violet">${certificateScreenHTML(me.name)}</div>`;
    requestAnimationFrame(() => triggerCelebration());
    return;
  }

  const filledCount = fields.filter(f => card[f.key].trim()).length;
  const phase = session.phase;
  const phaseHint =
    phase === 'card' ? `<div class="card-tag violet">Сейчас</div><div class="card-body">Альберт запустил итоговый мини-отчёт. Пишите коротко, конкретно, по делу: что было полезно, что уже пробовали, что внедряете в июне.</div>` :
    phase === 'done' ? `<div class="card-tag green">Спасибо</div><div class="card-body">Урок завершён. Мини-отчёт сохранён.</div>` :
    `<div class="card-tag gold">Можно начать заранее</div><div class="card-body">Мини-отчёт откроется после теста. Можно заполнить черновик сейчас и&nbsp;дополнить после разбора.</div>`;

  const filledStatus = filledCount === fields.length
    ? '<i class="ph ph-check-circle icon-green"></i> Все поля заполнены — сохранено'
    : `Заполнено: ${filledCount}/${fields.length}`;

  content.innerHTML = `
    <div class="h1">Мой итоговый AI-отчёт</div>
    <div class="lead">Не “послушал(а) курс”, а что теперь меняется в работе: обратная связь, реальные попытки, июньский план и один сценарий для команды.</div>

    <div class="card" style="margin-bottom:18px;">${phaseHint}</div>

    ${phase === 'card' && session.timerStartedAt ? `
      <div class="timer-text"><span>До&nbsp;конца тихой работы</span><span class="left" id="timer-left">${session.timerDurationSec || 600} сек</span></div>
      <div class="timer-bar"><div class="fill" id="timer-fill"></div></div>
    ` : ''}

    <div class="card outline-violet">
      ${fields.map((f, idx) => `
        <div class="field" ${idx === fields.length - 1 ? 'style="margin-bottom:0;"' : ''}>
          <label class="field-label" for="f-${f.key}"><span class="field-num">${idx + 1}</span> ${f.label}</label>
          <div class="field-hint">${f.hint}</div>
          <textarea id="f-${f.key}" placeholder="${escapeHtml(f.placeholder)}">${escapeHtml(card[f.key])}</textarea>
        </div>
      `).join('')}
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:18px; flex-wrap:wrap; gap:10px;">
      <div class="muted small" id="save-hint">${filledStatus}</div>
      <a href="test.html" class="btn btn-ghost"><i class="ph ph-arrow-left"></i> Назад к тесту</a>
    </div>
  `;

  const inputs = Object.fromEntries(fields.map(f => [f.key, document.getElementById('f-' + f.key)]));
  const onInput = debounce(() => persist(), 500);
  Object.entries(inputs).forEach(([key, el]) => {
    el.addEventListener('input', () => {
      card[key] = el.value;
      localStorage.setItem(storageBase + key, el.value);
      const hint = document.getElementById('save-hint');
      if (hint) hint.innerHTML = '<i class="ph ph-cloud-arrow-up icon-violet"></i> Сохраняем…';
      onInput();
    });
  });

  if (stopTimer) { stopTimer(); stopTimer = null; }
  if (phase === 'card' && session.timerStartedAt) {
    const fill = document.getElementById('timer-fill');
    const left = document.getElementById('timer-left');
    if (fill && left) {
      stopTimer = runTimer(session.timerStartedAt, session.timerDurationSec || 600, (rem, frac) => {
        fill.style.width = (frac * 100) + '%';
        left.textContent = formatTime(rem);
        fill.className = 'fill' + (rem < 45 ? ' danger' : rem < 90 ? ' warn' : '');
      }, () => {
        const hint = document.getElementById('save-hint');
        if (hint) hint.innerHTML = '<i class="ph ph-alarm icon-coral"></i> Время вышло — мини-отчёт сохранён.';
        persist();
      });
    }
  }
}

function persist() {
  const filledCount = fields.filter(f => card[f.key].trim()).length;
  pushCard(me.slug, {
    ...card,
    filledCount,
    totalFields: fields.length,
    done: filledCount === fields.length,
    ts: Date.now(),
  }).then(() => {
    const hint = document.getElementById('save-hint');
    if (hint) hint.innerHTML = filledCount === fields.length
      ? '<i class="ph ph-check-circle icon-green"></i> Все поля заполнены — сохранено'
      : `Заполнено: ${filledCount}/${fields.length} — сохранено`;
  }).catch(e => {
    console.warn('push card failed', e);
    const hint = document.getElementById('save-hint');
    if (hint) hint.innerHTML = '<i class="ph ph-warning icon-coral"></i> Сетевая ошибка — данные в браузере, попробуем ещё раз через 5 сек.';
    setTimeout(persist, 5000);
  });
}

function formatTime(sec) {
  const m = Math.floor(sec / 60); const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2,'0')}`;
}
function escapeHtml(s) { return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>

</body>
</html>
