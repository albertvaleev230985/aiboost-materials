<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Цифровой офис neovida: прототип</title>
<style>
:root{
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --coral:#E07461;--coral-d:#c05540;--coral-w:#fdf2ee;
  --neo:#8B6EB5;--neo-d:#6f52a0;--neo-w:#f3eff8;
  --ink:#141a3c;--ink-2:#575e7d;--ink-3:#9095ad;
  --bg:#eef0f8;--card:#ffffff;--line:#e9eaf4;--line-2:#f1f2f8;
  --mono:#3b4468;--grey:#c2c7d8;--wash:#f6f7fc;
  --rail:#ffffff;--railline:#f1f2f8;
  --wait:#c07a1e;--wait-d:#a06515;--ok:#2f8a63;--ok-w:#eff8f3;--dark:#141a3c;
  --sh:0 1px 2px rgba(20,26,60,.05);--shw:0 4px 20px rgba(20,26,60,.07)
}
*{box-sizing:border-box}
body{font-variant-numeric:tabular-nums;margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f);-webkit-font-smoothing:antialiased}
.wrap{max-width:1400px;margin:0 auto;padding:56px 24px 100px}
.top{margin-bottom:52px;max-width:800px}
.eyebrow{font:700 13px/1 var(--f);letter-spacing:.15em;text-transform:uppercase;color:var(--coral);margin-bottom:14px}
h1{font:700 clamp(30px,4.4vw,46px)/1.06 var(--f);letter-spacing:-.025em;margin:0 0 16px}
.lead{font-size:15px;color:var(--ink-2);margin:0 0 10px}
.lead b{color:var(--ink);font-weight:600}
.rule{width:56px;height:3px;background:var(--coral);border-radius:2px;margin:20px 0 0}
.shot{margin:0 0 68px}
.shot>h2{font:700 21px/1.5 var(--f);letter-spacing:-.015em;margin:0 0 6px;display:flex;align-items:baseline;gap:11px}
.shot>h2 .n{font:700 13px/1 var(--mf);color:var(--coral);border:1.5px solid var(--coral);border-radius:5px;padding:4px 6px;flex:none}
.shot>p{margin:0 0 20px;color:var(--ink-2);max-width:800px;font-size:15px}
.note{margin-top:16px;font-size:13px;color:var(--ink-2);border-left:3px solid var(--coral);padding-left:13px}
.note b{color:var(--ink)}

.win{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 18px 46px rgba(20,26,60,.10);position:relative}
.bar{display:flex;align-items:center;gap:8px;padding:14px 18px;background:#fafbfe;border-bottom:1px solid var(--line-2)}
.dot{width:11px;height:11px;border-radius:50%;background:#e5ded7}
.bar .ttl{margin-left:8px;font:600 13px/1 var(--f);color:var(--ink-3)}
.mode{margin-left:auto;display:flex;gap:2px;background:#e5ded7;border-radius:9px;padding:2px}
.mode b{font:600 13px/1 var(--f);padding:7px 13px;border-radius:10px;color:var(--ink-2)}
.mode b.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.07)}
.head{padding:18px 28px 0}
.hrow{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
.hrow .big{font:700 21px/1.2 var(--f);letter-spacing:-.02em}
.hrow .sm{font-size:13px;color:var(--ink-3);padding-bottom:3px}
.hrow .me{margin-left:auto;display:flex;align-items:center;gap:9px;padding-bottom:2px}
.hrow .me .nm{font:600 13px/1.2 var(--f);text-align:right}
.hrow .me .rl{font-size:12px;color:var(--ink-3);text-align:right}
.pane{position:relative;padding:22px 28px 20px}
.pane .rack:first-child{margin-top:0}
.av{width:32px;height:32px;border-radius:10px;background:var(--mono);color:#fff;display:grid;place-items:center;font:700 12px/1 var(--f);flex:none}

.rack{margin-top:18px}
.rhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rhead .t{font:700 15px/1 var(--f)}
.rhead .c{font:700 12px/1 var(--mf);background:#e5ded7;color:var(--ink-2);border-radius:20px;padding:4px 7px}
.rhead .all{margin-left:auto;font:600 13px/1 var(--f);color:var(--ink-2)}
.rhead .plus:nth-child(3){margin-left:auto}
.rhead .plus{width:26px;height:26px;border-radius:10px;border:1px dashed var(--ink-3);color:var(--ink-3);display:grid;place-items:center;font-size:15px;line-height:1;flex:none}
.shelf{display:flex;align-items:stretch;gap:12px;overflow-x:auto;padding-top:4px;position:relative;padding-bottom:8px}
.shelf::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--line);border-radius:3px}

.bg{width:132px;flex:none;display:flex;flex-direction:column;position:relative}
.clip{width:26px;height:7px;border-radius:4px;background:var(--grey);margin:0 auto -4px;position:relative;z-index:2}
.clip::after{content:"";position:absolute;left:50%;top:3px;width:10px;height:3px;border-radius:2px;background:var(--card);transform:translateX(-50%)}
.bd{min-width:0;position:relative;z-index:2;flex:1;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shb);padding:11px 11px 9px;text-align:center;position:relative;overflow:hidden}
.bd::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--line)}
.bd.run::before{background:var(--coral)}
.bd.wait::before{background:var(--wait)}
.bd.done::before{background:var(--ok)}
.bd .mn{width:32px;height:32px;border-radius:10px;background:var(--mono);color:#fff;display:grid;place-items:center;font:700 13px/1 var(--f);margin:4px auto 8px}
.bd .nm{font:600 13px/1.5 var(--f);min-height:28px}
.bd .jb{font-size:12px;color:var(--ink-3);margin-top:3px;line-height:1.5;min-height:22px}
.bd .st{margin-top:auto;padding-top:9px;border-top:1px solid var(--line-2);font:600 12px/1 var(--f);color:var(--ink-3);display:flex;align-items:center;justify-content:center;gap:5px}
.bd .st i{width:6px;height:6px;border-radius:50%;background:var(--line);flex:none}
.bd.run .st{color:var(--coral-d)} .bd.run .st i{background:var(--coral)}
.bd.done .st{color:var(--ok)} .bd.done .st i{background:var(--ok)}
.bd.wait{border-color:var(--wait);box-shadow:0 0 0 3px rgba(200,121,42,.13),var(--shb)}
.bd.wait .st{color:var(--wait-d)} .bd.wait .st i{background:var(--wait)}
.bd .from{position:absolute;top:7px;left:7px;font:600 12px/1 var(--f);color:var(--ink-2);background:var(--line-2);border-radius:4px;padding:3px 4px}
.bg.rec .bd{min-width:0;border-style:dashed;border-color:var(--neo);background:var(--neo-w)}
.bg.rec .bd::before{display:none}
.bg.rec .mn{background:var(--neo)}
.bg.rec .st{color:var(--neo-d);border-top-color:#e5ded7}
.bg.rec .st i{background:var(--neo)}

.grid{min-width:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:12px}
.job{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px 14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.job::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--coral)}
.job.auto::before{background:var(--line)}
.job.tipc{border:1px dashed var(--neo);background:var(--neo-w)}
.job.tipc::before{display:none}
.job .n{font:600 15px/1.5 var(--f);margin-bottom:5px}
.job .m{font-size:13px;color:var(--ink-3);line-height:1.5}
.job .row{display:flex;align-items:center;gap:8px;margin-top:10px}
.job .who{display:flex;align-items:center;gap:6px;font:600 12px/1 var(--f);color:var(--ink-2)}
.job .who .mn{width:20px;height:20px;border-radius:6px;font:700 12px/1 var(--f);color:#fff;background:var(--mono);display:grid;place-items:center}
.job .go{font:500 13px/1 var(--f);color:#fff;background:var(--dark);border-radius:999px;padding:10px 15px;white-space:nowrap;display:inline-block}
.job .go.q{background:var(--coral-w);color:var(--coral-d)}
.job .go.neo{background:var(--card);color:var(--ink-2);border:1px solid var(--line)}
.sw{width:36px;height:21px;border-radius:20px;background:var(--coral);position:relative;flex:none;margin-left:auto}
.sw::after{content:"";position:absolute;top:2.5px;right:2.5px;width:16px;height:16px;border-radius:50%;background:#fff}
.sw.off{background:var(--grey)}.sw.off::after{right:auto;left:2.5px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:8px 13px;font:600 13px/1 var(--f);background:var(--card);display:flex;align-items:center;gap:7px}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--coral);flex:none}
.chip.off{color:var(--ink-3)} .chip.off i{background:var(--line)}
.chip.add{border-style:dashed;color:var(--ink-3)} .chip.add i{display:none}
.chip.tipc{border:1px dashed var(--neo);background:var(--neo-w);color:var(--neo-d)} .chip.tipc i{background:var(--neo)}

.plugs{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:12px}
.plug{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:9px 12px;display:flex;align-items:center;gap:10px;box-shadow:var(--sh)}
.plug .sq{width:26px;height:26px;border-radius:10px;background:#f0eae5;color:var(--ink-2);display:grid;place-items:center;font:700 12px/1 var(--f);flex:none}
.plug .tx{min-width:0}
.plug .tx .n{display:block;font:600 13px/1.2 var(--f)}
.plug .tx .s{display:block;font-size:12px;color:var(--ink-2);margin-top:3px;font-weight:600}
.plug .tx .s.bad{color:var(--wait-d)}
.plug .tx .s.off{color:var(--ink-3)}
.plug.add{border-style:dashed;color:var(--ink-3);font:600 13px/1 var(--f);justify-content:center}

.libbar{margin-top:18px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh)}
.libbar .ic{width:30px;height:30px;border-radius:9px;background:var(--coral-w);color:var(--coral-d);display:grid;place-items:center;font-size:15px;flex:none}
.libbar>span:nth-child(2){min-width:0}
.libbar .t{display:block;font:600 13px/1.5 var(--f)}
.libbar .s{display:block;font-size:13px;color:var(--ink-3);margin-top:2px}
.libbar .go{font:500 13px/1 var(--f);color:#fff;background:var(--dark);border-radius:999px;padding:10px 15px;white-space:nowrap;display:inline-block}

.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line-2);margin-bottom:18px}
.tabs b{font:600 13px/1 var(--f);color:var(--ink-3);padding:0 0 12px;position:relative;display:flex;align-items:center;gap:7px}
.tabs b.on{color:var(--ink)}
.tabs b.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2.5px;background:var(--coral);border-radius:2px}
.tabs b.neo{color:var(--neo-d)}
.tabs b.neo.on::after{background:var(--neo)}
.filt{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filt b{font:600 13px/1 var(--f);padding:8px 12px;border-radius:999px;background:#f0eae5;color:var(--ink-2)}
.filt b.on{background:var(--ink);color:#fff}

.talk{display:grid;grid-template-columns:1fr 264px}
.tl{padding:22px 26px}
.tr{border-left:1px solid var(--line-2);background:var(--wash);padding:20px 18px}
.msg{display:flex;gap:11px;margin-bottom:16px}
.msg .mn{width:32px;height:32px;border-radius:10px;font:700 12px/1 var(--f);color:#fff;background:var(--mono);display:grid;place-items:center;flex:none}
.bub{background:var(--wash);border-radius:14px;padding:12px 15px;font-size:15px;max-width:min(560px,86%)}
.msg.me{justify-content:flex-end}
.msg.me .bub{background:var(--coral-d);color:#fff;border-radius:14px}
.bub.plain{background:transparent;padding:0;max-width:100%;line-height:1.6}
.src{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.src span{font:600 12px/1 var(--f);color:var(--ink-2);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 10px}
.live{border:1px solid var(--coral);background:var(--coral-w);border-radius:14px;padding:12px 14px;margin-bottom:16px}

.live .k{font:700 12px/1 var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--coral-d);margin-bottom:7px}
.live .t{font-size:15px}
.live .t .dim{color:var(--ink-3)}
.tip{border:1px solid var(--line);border-left:3px solid var(--coral);border-radius:0;padding:12px 13px;background:var(--card);margin-bottom:10px}
.tip .k{font:700 12px/1 var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--coral);margin-bottom:7px}
.tip .t2{font-size:13px;line-height:1.5}
.tip.neo{border-left-color:var(--neo)} .tip.neo .k{color:var(--neo-d)}
.tip.mute{border-left-color:var(--line)} .tip.mute .k{color:var(--ink-3)}

.steps{position:relative;padding-left:28px;max-width:640px;overflow:hidden}
.steps::before{content:"";position:absolute;left:7px;top:9px;bottom:26px;width:2px;background:var(--coral)}
.st2.now::after{content:"";position:absolute;left:-21px;top:12px;width:2px;height:2000px;background:var(--line)}
.st2{position:relative;margin-bottom:18px}
.st2::before{content:"";position:absolute;left:-28px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--coral);border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--coral)}
.st2.now::before{background:var(--card);box-shadow:0 0 0 1.5px var(--wait),0 0 0 6px rgba(200,121,42,.15)}
.st2.todo::before{background:var(--grey);box-shadow:0 0 0 1.5px #c9bdb2}
.st2 .n{font:600 15px/1.5 var(--f)}
.st2 .r{font-size:13px;color:var(--ink-3);margin-top:3px}
.st2.todo .n{color:var(--ink-3);font-weight:500}
.card{border:1px solid var(--line);border-radius:14px;padding:15px;background:var(--card);margin-top:12px;box-shadow:var(--sh)}
.card.cf{border-color:var(--wait);background:var(--wait-w);box-shadow:none}
.card .h3{font:700 13px/1.5 var(--f);letter-spacing:-.01em;margin-bottom:10px}
.kv{display:grid;grid-template-columns:160px 1fr;gap:10px;font-size:13px;padding:3px 0;color:var(--ink-2)}
.kv b{color:var(--ink);font-weight:600}
.kv:only-child,.kv.wide{grid-template-columns:1fr}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{font:600 13px/1 var(--f);padding:10px 15px;border-radius:999px;background:var(--coral-d);color:#fff}
.btn.gh{background:transparent;color:var(--ink-2);border:1px solid var(--line)}

.krow{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:8px;position:relative}
.krow.wait{border-color:var(--wait);box-shadow:0 0 0 3px rgba(200,121,42,.12)}
.krow .mn{width:20px;height:20px;border-radius:6px;background:var(--mono);color:#fff;display:grid;place-items:center;font:700 12px/1 var(--f);flex:none}
.krow .who{font:400 13px/1 var(--f);color:var(--ink-2);flex:none;width:132px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.krow .job2{font-size:13px;color:var(--ink-3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.krow .num{font:700 13px/1 var(--mf);color:var(--ink);flex:none}
.krow .bars{display:flex;gap:2px;flex:none}
.krow .bars i{width:3px;height:11px;border-radius:1px;background:var(--line)}
.krow .bars i.f{background:var(--coral)}
.krow .bars i.d{background:var(--ok)}
.krow .stt{font:600 12px/1 var(--f);color:var(--ink-3);flex:none;width:86px;text-align:right}
.krow.run .stt{color:var(--coral-d)}
.krow.done .stt{color:var(--ok)}
.krow.wait .stt{color:var(--wait-d)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--card);box-shadow:var(--sh)}
.kpi .v{font:700 28px/1 var(--f);letter-spacing:-.03em}
.kpi .l{font-size:12px;color:var(--ink-3);margin-top:7px;line-height:1.5}
.kpi .t{font:600 12px/1 var(--f);color:var(--ok);margin-top:9px}
.kpi.w .t{color:var(--wait-d)}

.neoball{width:56px;height:56px;border-radius:50%;background:var(--card);border:1px solid var(--line);box-shadow:var(--shw);display:grid;place-items:center;position:relative}
.neoball svg{width:34px;height:34px}
.neoball .ring{position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--coral);opacity:.28}
.corner{position:absolute;right:26px;bottom:22px;max-width:calc(100% - 52px);display:flex;align-items:flex-end;gap:10px}
.win:has(.corner) .libbar{padding-right:352px}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shw);padding:12px 14px;max-width:270px}
.bubble .k{font:700 12px/1 var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--neo-d);margin-bottom:8px}
.bubble .ch{display:flex;flex-direction:column;gap:6px}
.bubble .ch b{font:600 13px/1.5 var(--f);border:1px solid var(--line);border-radius:10px;padding:7px 9px;color:var(--ink-2)}

.states{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sc{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:16px;text-align:center;box-shadow:var(--sh)}
.sc .ball{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;position:relative;background:var(--wash)}
.sc .ball svg{width:38px;height:38px}
.sc .nm{font:600 13px/1.2 var(--f)}
.sc .ds{font-size:12px;color:var(--ink-3);margin-top:5px;line-height:1.5}
.sc .rr{position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--coral);opacity:.3}
.sc .rr.w{border-color:var(--wait);opacity:.5}
.sc .rr.out{inset:-13px;opacity:.16}
.sc .ball.say svg{transform:rotate(-5deg)}
.sc .wave.up{margin:0 0 8px}
.wave{display:flex;align-items:center;justify-content:center;gap:2px;height:14px;margin-top:8px}
.wave i{width:3px;border-radius:2px;background:var(--coral)}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.ctrl{border:1px solid var(--line);border-radius:999px;padding:9px 12px;font:600 13px/1 var(--f);background:var(--card);display:flex;align-items:center;gap:7px}
.ctrl i{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.ctrl.off{color:var(--ink-3)} .ctrl.off i{background:var(--line)}

.vid{display:grid;grid-template-columns:1fr 264px;min-height:392px}
.stage{background:var(--dark);display:grid;grid-template-rows:1fr auto}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:15px}
.tile{border-radius:14px;background:rgba(255,255,255,.07);display:grid;place-items:center;min-height:146px;position:relative}
.tile .mn{width:44px;height:44px;border-radius:14px;background:var(--mono);color:#fff;display:grid;place-items:center;font:700 13px/1 var(--f)}
.tile .lb{position:absolute;left:11px;bottom:10px;font:600 12px/1 var(--f);color:#ffffff;background:rgba(0,0,0,.4);padding:6px 9px;border-radius:7px}
.tile .rc{position:absolute;right:11px;top:10px;font:700 12px/1 var(--f);color:#fff;background:var(--coral-d);padding:5px 8px;border-radius:20px;letter-spacing:.06em}
.ctrlbar{display:flex;justify-content:center;gap:9px;padding:13px;border-top:1px solid rgba(255,255,255,.08)}
.ctrlbar b{width:35px;height:35px;border-radius:50%;background:rgba(255,255,255,.1)}
.ctrlbar b.end{background:var(--coral)}
.pn{border-left:1px solid var(--line-2);padding:18px;background:var(--wash)}
.swapb{display:flex;gap:9px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line-2)}
.mini{width:70px;flex:none;text-align:center}
.mini .mn{width:32px;height:32px;border-radius:10px;background:var(--mono);color:#fff;display:grid;place-items:center;font:700 12px/1 var(--f);margin:0 auto 6px}
.mini .t3{font:600 12px/1.2 var(--f);color:var(--ink-3)}
.mini.on .t3{color:var(--ink)}
.mini.on .mn{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--coral)}
.open{border:1px solid var(--line);background:var(--wash);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--ink-2);margin-bottom:12px}
.open b{color:var(--ink-2);font-weight:700;display:block;margin-bottom:4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase}


.app{display:grid;grid-template-columns:214px 1fr 246px;min-height:556px}

<script>


// Единый левый сайдбар для всех экранов: правится в одном месте
const RAIL = {
  tools: [['Ассистенты','5'],['Сценарии','6'],['Навыки','8'],['Подключения','5'],['Каталог','240']],
  projects: [['ЖК Семь прудов','14'],['Гавриловы, уч. 14','6'],['Осенняя акция','3']],
  chats: [['Рассрочка Гавриловым',''],['Риск в договоре','wait'],['Возврат брони',''],['НДС в рассрочке',''],['Сводка по воронке, июль','']],
  user: 'Ирина Петрова'
};
const ICO = {
  home:'<path d="M4 10.5L12 4l8 6.5V20H4z"/><path d="M9.5 20v-5.5h5V20"/>',
  cam:'<path d="M3.5 7.5h11v9h-11z"/><path d="M14.5 12l6-3.5v7z"/>',
  phone:'<path d="M6.5 3.5h3l1.5 4-2 1.5a11 11 0 006 6l1.5-2 4 1.5v3a2 2 0 01-2.2 2A16.5 16.5 0 014.5 5.7 2 2 0 016.5 3.5z"/>',
  canvas:'<path d="M4 4.5h16v12H4z"/><path d="M8 20h8"/><path d="M8.5 12l2.5-3 2 2.5 1.5-1.5 2 3"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  sun:'<path d="M3.5 13.5h4l1.5 2.5h6l1.5-2.5h4"/><path d="M3.5 13.5l2.8-7A1.5 1.5 0 017.7 5.5h8.6a1.5 1.5 0 011.4 1l2.8 7v4a1.5 1.5 0 01-1.5 1.5H5a1.5 1.5 0 01-1.5-1.5z"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>',
  gear:'<path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="17" r="2"/>',
  spark:'<path d="M12 3.5l1.8 4.7 4.7 1.8-4.7 1.8L12 16.5l-1.8-4.7L5.5 10l4.7-1.8z"/><path d="M18.5 16l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/>',
  folder:'<path d="M3 7.5A1.5 1.5 0 014.5 6h4l2 2.2h7A1.5 1.5 0 0119 9.7v7.8a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 013 17.5z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>'
};
const svg = (d, cls) => `<svg${cls?' class="'+cls+'"':''} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;

function railHTML(o) {
  const active = o.rail || '', proj = o.proj || '', chat = o.chat || '', mode = o.mode || 'Работа';
  const row = (name, cnt, opts = {}) => {
    const on = opts.on ? ' on' : '', cls = opts.cls ? ' ' + opts.cls : '';
    const ic = opts.icon ? svg(ICO[opts.icon], 'fi') : '';
    const dot = opts.wait ? '<span class="d"></span>' : '';
    const c = cnt ? `<span class="cnt">${cnt}</span>` : '';
    return `<div class="lrow${on}${cls}">${ic}${dot}<span class="tt">${name}</span>${c}</div>`;
  };
  const act = (n, ic, on) => `<div class="lrow${on?' on':''}">${svg(ICO[ic],'fi')}<span class="tt">${n}</span></div>`;
  let h = `<div class="brand"><span class="mk"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM4 13h7v7H4zM13 13h7v7h-7z" fill="#fff"/><path d="M13 4h7v7h-7z" fill="#E07461"/></svg></span><span class="nm">Цифровой офис</span></div><div class="segm">
    <b class="${mode === 'Работа' ? 'on' : ''}">${svg(ICO.home)}Работа</b>
    <b class="${mode === 'N-агент' ? 'on' : ''}">${svg(ICO.spark)}N-агент</b>
  </div><div class="rdiv"></div>
  <div class="lnew">${svg(ICO.plus)}Новый чат</div>`;
  h += `<div class="lrow${o.tool==='Пока вас не было'?' on':''}">${svg(ICO.sun,'fi')}<span class="tt">Пока вас не было</span><span class="cnt bdg">3</span></div>`;
  h += act('Запланировано','clock', o.tool==='Запланировано');
  h += act('Видеовстреча','cam', o.tool==='Видеовстреча');
  h += '<div class="sec2">Мои инструменты</div>';
  h += RAIL.tools.map(([n, c]) => row(n, c, { on: n === active })).join('');
  h += '<div class="sec2">Проекты</div>';
  h += RAIL.projects.map(([n, c]) => row(n, c, { on: n === proj, cls: 'proj', icon: 'folder' })).join('');
  h += '<div class="sec2">Чаты</div>';
  h += `<div class="lrow srch">${svg(ICO.search,'fi')}<span class="tt">Найти чат</span></div>`;
  h += RAIL.chats.map(([n, s]) => row(n, '', { on: n === chat, wait: s === 'wait' })).join('');
  h += `<div class="me2">${RAIL.user}<span class="gear">${svg(ICO.gear)}</span></div>`;
  return h;
}
const MRAIL = [['Люди','6'],['Роли','4'],['База знаний','вкл'],['Отдача','']];
const MRAIL2 = [['Каталог','240'],['Подключения','5'],['Заявки','2'],['Журнал','']];
function mrailHTML(active){
  let h = '<div class="brand"><span class="mk"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM4 13h7v7H4zM13 13h7v7h-7z" fill="#fff"/><path d="M13 4h7v7h-7z" fill="#E07461"/></svg></span><span class="nm">Мастер-аккаунт</span></div>';
  h += '<div class="sec2 first">ООО «Семь прудов»</div>';
  h += MRAIL.map(([n,c])=>`<div class="lrow${n===active?' on':''}"><span class="tt">${n}</span>${c?`<span class="cnt">${c}</span>`:''}</div>`).join('');
  h += '<div class="sec2">Настройки</div>';
  h += MRAIL2.map(([n,c])=>`<div class="lrow${n===active?' on':''}"><span class="tt">${n}</span>${c?`<span class="cnt">${c}</span>`:''}</div>`).join('');
  h += '<div class="me2">Альберт В. · мастер-аккаунт</div>';

док</div><div class=\"pw\">Отправка только после подтверждения человеком, отключить подтверждение нельзя</div></div><div class=\"pr\"><span class=\"stt ok\"><i></i>Выдан</span></div></div>\n        <div class=\"perm\"><div><div class=\"pt\">Зарплаты и кадровые документы</div><div class=\"pw\">Закрыто на уровне компании</div></div><div class=\"pr\"><span class=\"stt\"><i></i>Запрещено</span></div></div>\n        <div class=\"outline\"><b>Чего он не делает никогда:</b> не подписывает документы, не отправляет ничего контрагенту без подтверждения, не даёт заключений по трудовым спорам (это другая роль), не меняет шаблоны компании.</div>\n      </div></div>\n      ", "r": "<div class=\"rrail\">\n        <div class=\"sec2 first\">Что помнит</div>\n        <div class=\"nrow\"><div class=\"t2\">Правила компании</div><div class=\"s2\">14 фактов, общие для всех, кто с ним работает</div></div>\n        <div class=\"nrow\"><div class=\"t2\">По проектам</div><div class=\"s2\">37 фактов, привязаны к сделкам</div></div>\n        <div class=\"nrow\"><div class=\"t2\">Ваши привычки</div><div class=\"s2\">6 фактов, только у вас</div></div>\n        <div class=\"sec2\">Как работает</div>\n        <div class=\"lrow\"><span class=\"tt\">Запусков за месяц</span><span class=\"cnt\">128</span></div>\n        <div class=\"lrow\"><span class=\"tt\">Не переписывали</span><span class=\"cnt\">92%</span></div>\n        <div class=\"lrow\"><span class=\"tt\">Остановок на вас</span><span class=\"cnt\">14</span></div>\n        <div class=\"sec2\">Где лежит</div>\n        <div class=\"nrow\"><div class=\"t2\">Сервер компании</div><div class=\"s2\">Правила и память проектов. Переживают ноутбук и увольнение</div></div>\n        <div class=\"nrow\"><div class=\"t2\">Ваш компьютер</div><div class=\"s2\">Только ваши привычки и кэш"}, "Память агента: видно, откуда взялось, и можно поправить": {"c": "<div class=\"center\"><div class=\"dlg\" style=\"max-width:100%\">\n        <div class=\"phead\"><span class=\"ptitle\">Что помнит Юрист</span>\n          <span class=\"pacts\"><span class=\"pbtn\">Лента изменений</span><span class=\"pbtn\">Добавить правило</span></span></div>\n        <div class=\"tabs2\"><b class=\"on\">Правила компании<span class=\"pc\">14</span></b><b>По проектам<span class=\"pc\">37</span></b><b>Ваши привычки<span class=\"pc\">6</span></b></div>\n        <div class=\"subt\">Общее для всех, кто работает с этим агентом. Правила пишет человек, наблюдения агент дописывает сам и помечает</div>\n        <div class=\"fact\"><div class=\"ft\">Рассрочку выше 3 млн согласовывает коммерческий директор.</div>\n          <div class=\"fm\"><span>Правило, добавил Дмитрий Волков</span><span>14 июня</span><b>Откуда это</b></div></div>\n        <div class=\"fact\"><div class=\"ft\">Пункт про пени из договора не убираем никогда, даже при беспроцентной рассрочке.</div>\n          <div class=\"fm\"><span>Правило, добавил Дмитрий Волков</span><span>14 июня</span><b>Откуда это</b></div></div>\n        <div class=\"fact\"><div class=\"ft\">Актуальный шаблон ДКП от 14 мая. <s>Раньше: от 3 февраля</s></div>\n          <div class=\"fm\"><span>Заметил сам, подтверждено человеком</span><span>обновлено 15 мая</span><b>Откуда это</b></div></div>\n        <div class=\"fact\"><div class=\"ft\">В договорах на участки всегда указываем срок передачи, иначе покупатель не может оформить право.</div>\n          <div class=\"fm\"><span>Заметил сам, повторилось 4 раза</span><span>2 июля</span><b>Откуда это</b></div></div>\n        <div class=\"fact\"><div class=\"ft\">Протокол разногласий сначала показываем юристу контрагента, потом отправляем в ЭДО.</div>\n          <div class=\"fm\"><span>Правило, добавила Ирина Петрова</span><span>21 июля</span><b>Откуда это</b></div></div>\n        <div class=\"apply\">Занято <b>14 из 200 строк</b> памяти. Когда место кончается, агент предложит свернуть старое, а не потеряет его молча.</div>\n      </div></div>\n      ", "r": "<div class=\"rrail\">\n ирает КП в фирменном виде из карточки сделки</div>\n            <div class=\"smeta\">neovida · версия 5 просит новый доступ · на паузе</div></div>\n          <div class=\"sr\"><span class=\"flag n\">Обновление ждёт согласия</span><span class=\"acc out\">Действует наружу</span></div>\n        </div>\n        <div class=\"grp2\">Включены</div>\n        <div class=\"srow\">\n          <div><div class=\"sn\">Проверка договора на риски</div><div class=\"sd\">Сверяет с регламентом, находит расхождения и пропуски</div>\n            <div class=\"smeta\">компании · Дмитрий Волков · 94% результатов не переписывали · 340 кейсов</div></div>\n          <div class=\"sr\"><span class=\"tgl lock\"></span><span class=\"acc rd\">Читает</span></div>\n        </div>\n        <div class=\"srow\">\n          <div><div class=\"sn\">Ответ на возражение по цене</div><div class=\"sd\">Аргументы из практики по вашим сделкам</div>\n            <div class=\"smeta\">компании · назначено должностью · 88% не переписывали</div></div>\n          <div class=\"sr\"><span class=\"tgl lock\"></span><span class=\"acc\">Без доступов</span></div>\n        </div>\n        <div class=\"srow\">\n          <div><div class=\"sn\">Мой стиль письма</div><div class=\"sd\">Пишет так, как пишете вы: короче, без канцелярита</div>\n            <div class=\"smeta\">мой · взят 14 июня · 91% не переписывали</div></div>\n          <div class=\"sr\"><span class=\"tgl\"></span><span class=\"acc\">Без доступов</span></div>\n        </div>\n        <div class=\"grp2\">Давно не пользуетесь</div>\n        <div class=\"srow off\">\n          <div><div class=\"sn\">Сверка прайсов</div><div class=\"sd\">Сравнивает два прайса и показывает, что изменилось</div>\n            <div class=\"smeta\">не запускался 41 день · доступ к папке Прайсы будет отозван через 5 дней</div></div>\n          <div class=\"sr\"><span class=\"flag g\">Оставить</span><span class=\"flag g\">Убрать</span></div>\n        </div>\n      </div></div>\n      ", "r": "<div class=\"rrail\">\n        <div class=\"sec2 first\">Что значат значки</div>\n        <div class=\"nrow\"><div class=\"t2\">Без доступов</div><div class=\"s2\">Работает только с тем, что вы дали в чате</div></div>\n        <div class=\"nrow\"><div class=\"t2\">Читает</div><div class=\"s2\">Видит данные, но наружу ничего не отправляет</div></div>\n        <div class=\"nrow\"><div class=\"t2\">Действует наружу</div><div class=\"s2\">Может отправить письмо, изменить сделку, позвонить</div></div>\n        <div class=\"sec2\">Замок вместо тумблера</div>\n        <div class=\"nrow\"><div class=\"t2\">Назначено компанией</div><div class=\"s2\">Выключить нельзя, обновляется централизованно"}, "Навык изнутри": {"c": "<div class=\"center\"><div class=\"dlg\" style=\"max-width:100%\">\n        <div class=\"phead\"><span class=\"ptitle\">Проверка договора на риски</span>\n          <span class=\"pacts\"><span class=\"pbtn\">Показать содержимое</span><span class=\"pbtn\">Запустить</span></span></div>\n        <div class=\"subt\">Сверяет договор с нашим регламентом, находит расхождения, пропущенные сроки и опасные формулировки · навык компании, владелец Дмитрий Волков · версия 4 от 28 июля</div>\n\n        <div class=\"grp2\">Что он делает</div>\n        <div class=\"step2\"><em>1</em><div>Читает договор и вытаскивает существенные условия</div></div>\n        <div class=\"step2\"><em>2</em><div>Сверяет с регламентом продаж и шаблоном ДКП</div></div>\n        <div class=\"step2\"><em>3</em><div>Находит расхождения и оценивает, чем они грозят</div></div>\n        <div class=\"step2\"><em>4</em><div>Показывает список правок<div class=\"hu\">Здесь останавливается и ждёт вас</div></div></div>\n        <div class=\"step2\"><em>5</em><div>Готовит протокол разногласий по вашему решению</div></div>\n\n        <div class=\"grp2\">Сможет видеть</div>\n        <div class=\"perm\"><div><div class=\"pt\">Договор, который вы открыли</div><div class=\"pw\">Нужно, чтобы разобрать условия /i><i class=\"z\"></i><i class=\"z\"></i><i class=\"z\"></i><i class=\"z\"></i><i class=\"z\"></i><i class=\"z\"></i></span></td><td class=\"n\">2</td><td class=\"n\">9</td><td><span class=\"flag w\">почти всем</span></td></tr>\n        </table>\n        <div class=\"apply\">Ольга завела рабочее место месяц назад и почти не заходит. <b>Либо роль собрана не под её работу, либо ей никто не показал.</b> Это и есть главный сигнал этого экрана.</div>\n      </div></div>\n      ", "r": "<div class=\"rrail\">\n        <div class=\"sec2 first\">Выдали и не пользуются</div>\n        <div class=\"nrow\"><div class=\"t2\">Разбор звонка</div><div class=\"s2\">Доступен месяц, не взял никто</div></div>\n        <div class=\"nrow\"><div class=\"t2\">Согласование скидки</div><div class=\"s2\">Запускали 1 раз</div></div>\n        <div class=\"nrow\"><div class=\"t2\">Онбординг новичка</div><div class=\"s2\">Ни разу, а новичок был</div></div>\n        <div class=\"nrow\"><div class=\"t2\">Сверка прайсов</div><div class=\"s2\">Последний запуск 41 день назад</div></div>\n        <div class=\"sec2\">Что чаще всего</div>\n        <div class=\"lrow\"><span class=\"tt\">Обработать входящий лид</span><span class=\"cnt\">96</span></div>\n        <div class=\"lrow\"><span class=\"tt\">Проверка договора</span><span class=\"cnt\">62</span></div>\n        <div class=\"lrow\"><span class=\"tt\">Сводка по воронке</span><span class=\"cnt\">48</span>"}, "Мастер-аккаунт: что увидит сотрудник": {"c": "<div class=\"center\"><div class=\"dlg\" style=\"max-width:100%\">\n        <div class=\"phead\"><span class=\"ptitle\">Глазами Ирины Петровой</span>\n          <span class=\"pacts\"><span class=\"pbtn\">Сменить сотрудника</span><span class=\"pbtn\">Открыть в режиме чтения</span></span></div>\n        <div class=\"prev\">\n          <div class=\"ph3\">От компании · убрать нельзя</div>\n          <div class=\"pb3\">\n            <span class=\"pill co\">Наставник по продажам</span><span class=\"pill co\">Юрист</span><span class=\"pill co\">Секретарь встреч</span>\n            <span class=\"pill co\">Обработать входящий лид</span><span class=\"pill co\">Собрать КП</span>\n            <span class=\"pill co\">1С: Управление торговлей</span><span class=\"pill co\">Битрикс24</span>\n          </div>\n        </div>\n        <div class=\"prev\">\n          <div class=\"ph3\">Своё · взяла сама</div>\n          <div class=\"pb3\">\n            <span class=\"pill\">Аналитик</span><span class=\"pill\">Мой стиль письма</span><span class=\"pill\">Разбор возражений</span>\n          </div>\n        </div>\n        <div class=\"h3b\">Откуда у неё доступ</div>\n        <div class=\"subt\">Права складываются из нескольких источников, поэтому «почему у неё доступ к 1С» это неочевидный вопрос</div>\n        <div class=\"src2\"><b>1С: Управление торговлей</b><span>должность «Менеджер по продажам»</span></div>\n        <div class=\"src2\"><b>Битрикс24</b><span>должность «Менеджер по продажам»</span></div>\n        <div class=\"src2\"><b>Проект «ЖК Семь прудов»</b><span>участник проекта, добавил Дмитрий Волков 14 июня</span></div>\n        <div class=\"src2\"><b>Агент «Юрист»</b><span>выдан лично 12 июля, вами</span></div>\n        <div class=\"src2\"><b>Телефония</b><span>подключила сама, личная учётная запись</span></div>\n      </div></div>\n      ", "r": "<div class=\"rrail\">\n        <div class=\"sec2 first\">Состояние у неё</div>\n        <div class=\"nrow\"><div class=\"t2\">Всё применено</div><div class=\"s2\">Последняя синхронизация сегодня в 14:20</div></div>\n        <div class=\"sec2\">Подключения у неё лично</div>\n        <div class=\"lrow\"><span class=\"tt\">1С</span></div>\n        <div class=\"lrow\"><span class=\"tt\">Битрикс24</span></div>\n        <div class=\"lrow\"><span class=\"tt\">Почта и календарь</span></div>\n        <div class=\"lrow\"><span class=\"tt\" style=\"color:var(--wait-d)\">Телефония · нужен вход</span></div>\n        <div class=\"sec2\">Видит в каталоге</div>\n        <div class=\"lrow\"><span class=\"tt\">Доступно ей</span><span class=\"cnt\">86</span></div>\n        <div class=\"lrow\"><span class=\"tt\">Скрыто от неё</span><span class=\"cnt\">154</span>"}, "Мастер-аккаунт: подключения": {"c": "<div class=\"center\"><div class=\"dlg\" style=\"max-width:100%\">\n        <div class=\"phead\"><span class=\"ptitle\">Подключения</span><span class=\"pacts\"><span class=\"pbtn\">Подключить</span></span></div>\n        <table class=\"tbl\">\n          <tr><th>Система</th><th>Тип</th><th>Что разрешено</th><th>Когда спрашивать</th><th>Состояние</th></tr>\n          <tr><td><b>1С: Управление торговлей</b><div class=\"u\">учётная запись компании</div></td><td>Служебное</td><td>Чтение и запись</td><td>При изменениях</td><td><span class=\"stt ok\"><i></i>Работает</span></td></tr>\n          <tr><td><b>Битрикс24</b><div class=\"u\">учётная запись компании</div></td><td>Служебное</td><td>Чтение и запись</td><td>При важных действиях</td><td><span class=\"stt ok\"><i></i>Работает</span></td></tr>\n          <tr><td><b>Почта и календарь</b><div class=\"u\">у каждого своя</div></td><td>Личное</td><td>Чтение, отправка по подтверждению</td><td>Всегда</td><td><span class=\"stt ok\"><i></i>Работает у 5 из 6</span></td></tr>\n          <tr><td><b>Телефония</b><div class=\"u\">Ирина Петрова</div></td><td>Личное</td><td>Только чтение</td><td>Никогда</td><td><span class=\"stt w\"><i></i>Требуется вход</span></td></tr>\n          <tr><td><b>ЭДО Диадок</b><div class=\"u\">учётная запись компании</div></td><td>Общее по запросу</td><td>Выбранные операции</td><td>Всегда</td><td><span class=\"stt ok\"><i></i>Работает</span></td></tr>\n        </table>\n        <div class=\"warn\">\n          <div class=\"t\">Сценарий «Обзвон должников» опубликован на всю компанию, но внутри личное подключение</div>\n          <div class=\"s\">Телефония подключена под учётной записью Ирины Петровой. Любой, кто запустит этот сценарий, будет звонить и слушать записи от её имени. В журнале это тоже будет она.</div>\n          <div class=\"a\">Перевести на служебную учётную запись</div>\n        </div>\n        <div class=\"apply\">Права в подключениях сверяются раз в сутки. <b>Последняя сверка сегодня в 06:00.</b> Если человеку урезали доступ в 1С, здесь это отразится не сразу.</div>\n      </div></div>\n      ", "r": "<div class=\"rrail\">\n        <div class=\"sec2 first\">Три типа</div>\n        <div class=\"nrow\"><div class=\"t2\">Личное</div><div class=\"s2\">Сотрудник входит сам, работает только у него</div></div>\n        <div class=\"nrow\"><div class=\"t2\">Служебное</div><div class=\"s2\">Учётная запись компании, работает у всех, кому выдано</div></div>\n        <div class=\"nrow\"><div class=\"t2\">Общее по запросу</div><div class=\"s2\">Работает, но каждый запуск подтверждает человек</div></div>\n        <div class=\"sec2\">Проверить</div>\n        <div class=\"nrow w\"><div class=\"t2\">1 личное подключение в общем объекте</div><div class=\"s2\">Сценарий «Обзвон должников»"}, "Мастер-аккаунт: увольнение это мастер, а не кнопка": {"c": "<div class=\"center\"><div class=\"dlg\" style=\"max-width:100%\">\n        <div class=\"phead\"><span class=\"ptitle\">Увольнение: Дмитрий Волков</span></div>\n        <div class=\"wiz\">\n          <b class=\"done\"><em>ШАГ 1</em>Преемник</b>\n          <b class=\"done\"><em>ШАГ 2</em>Что с объектами</b>\n          <b class=\"on\"><em>ШАГ 3</em>Личные подключения</b>\n          <b><em>ШАГ 4</em>Итог</b>\n          <b><em>ШАГ 5</em>Подтверждение</b>\n        </div>\n        <div class=\"h3b\">У Дмитрия три личных подключения</div>\n        <div class=\"subt\">Если просто отключить, часть работы компании встанет. Ниже видно, что именно</div>\n        <table class=\"tbl\">\n          <tr><th>Подключение</th><th>Что сломается</th><th>Решение</th></tr>\n          <tr><td><b>Почта отдела</b><div class=\"u\">d.volkov@7prudov.ru</div></td><td><b>2 сценария</b><div class=\"u\">Ответы на входящие заявки, Рассылка по базе<br>работают ежедневно, у 4 человек</div></td><td><span class=\"seg3\"><b class=\"on\">На служебную</b><b>Отключить</b></span></td></tr>\n          <tr><td><b>Телефония</b><div class=\"u\">внутренний 214</div></td><td><b>1 сценарий</b><div class=\"u\">Разбор звонков отдела, по пятницам</div></td><td><span class=\"seg3\"><b class=\"on\">На служебную</b><b>Отключить</b></span></td></tr>\n          <tr><td><b>Личный Telegram</b><div class=\"u\">@dvolkov</div></td><td>Ничего<div class=\"u\">Использовался только им</div></td><td><span class=\"seg3\"><b>На служебную</b><b class=\"on\">Отключить</b></span></td></tr>\n        </table>\n        <div class=\"warn\">\n          <div class=\"t\">Что будет с доступом самого Дмитрия после передачи</div>\n          <div class=\"s\">Переданные объекты он больше не увидит, включая чтение. Историю его чатов компания сохраняет, но ему она будет недоступна. Это решение стоит принять осознанно: у крупных продуктов на этот счёт противоположные подходы.</div>\n        </div>\n      </div></div>\n      ", "r": "<div class=\"rrail\">\n        <div class=\"sec2 first\">Уже решено</div>\n        <div class=\"nrow\"><div class=\"t2\">Преемник: Ирина Петрова</div><div class=\"s2\">Шаг 1</div></div>\n        <div class=\"nrow\"><div class=\"t2\">Объекты</div><div class=\"s2\">4 передать, 2 в архив, 0 удалить</div></div>\n        <div class=\"sec2\">После увольнения</div>\n        <div class=\"nrow\"><div class=\"t2\">Ни один объект не осиротеет</div><div class=\"s2\">Владелец мастер-аккаунта остаётся владельцем всего по умолчанию</div></div>\n        <div class=\"nrow\"><div class=\"t2\">Дмитрий в списке «Уволенные»</div><div class=\"s2\">История и файлы сохранены"}};

let who='emp', a='Рассрочка Гавриловым', am='Люди', override=null, crumb=null;
function boxRail(){
  const rail=document.getElementById('rail'); const kids=[...rail.children];
  const start=kids.findIndex(el=>el.classList.contains('rdiv'));
  const end=kids.findIndex(el=>el.classList.contains('me2'));
  if(start<0) return;
  const box=document.createElement('div'); box.className='railscroll';
  kids.slice(start, end<0?kids.length:end).forEach(el=>box.appendChild(el));
  if(end<0) rail.appendChild(box); else rail.insertBefore(box, kids[end]);
}

  const rail=document.getElementById('rail'), stage=document.getElementById('stage'), lean=document.getElementById('lean');
  if(who==='emp') rail.innerHTML=railHTML({rail:TOOLS.includes(a)?a:'', proj:PROJ.includes(a)?a:'', tool:SURF.includes(a)?a:'', chat:CHATS.includes(a)?a:''});
  else rail.innerHTML=mrailHTML(am);
  boxRail();
  const key = override || (who==='emp'?NAV[a]:MNAV[am]);
  const sc = key && S[key];

    el.onclick=()=>{ override=null; crumb=null; if(who==='emp') a=t.textContent.trim(); else am=t.textContent.trim(); draw(); };
  });
  const nw=document.querySelector('#rail .lnew'); if(nw) nw.onclick=()=>{override=null;crumb=null;a='Новый чат';draw();};

  document.querySelectorAll('#rail .segm b').forEach(b=>b.onclick=()=>{document.querySelectorAll('#rail .segm b').forEach(x=>x.classList.remove('on'));b.classList.add('on');});

  document.querySelectorAll('#stage .srow').forEach(el=>{const n=el.querySelector('.sn'); if(n) el.onclick=()=>go('Навык изнутри', n.textContent.trim());});
  document.querySelectorAll('#stage .bd').forEach(el=>{const n=el.querySelector('.nm'); if(n) el.onclick=()=>go('Бэйдж: лицо и оборот', n.textContent.trim());});
  document.querySelectorAll('#stage .cd').forEach(el=>{const n=el.querySelector('.t1'); if(n) el.onclick=()=>go('Основной рабочий экран', n.textContent.trim());});
  document.querySelectorAll('#stage .ptabs b, #stage .tabs b, #stage .seg3 b').forEach(b=>b.onclick=()=>{
    const p=b.parentElement; p.querySelectorAll('b').forEach(x=>x.classList.remove('on')); b.classList.add('on');});
  const bk=document.querySelector('#stage .crumb .bk'); if(bk) bk.onclick=()=>{override=null;crumb=null;draw();};
}
document.querySelectorAll('.pbar .sw2 b').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.pbar .sw2 b').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); who=b.dataset.who; override=null; crumb=null; draw();});
const mm=document.getElementById('mm'), more=document.getElementById('more');
mm.innerHTML = Object.keys(S).map(k=>'<i data-k="'+k.replace(/"/g,'&quot;')+'">'+k+'</i>').join('');
mm.querySelectorAll('i').forEach(el=>el.onclick=()=>{ more.classList.remove('op'); go(el.dataset.k, el.dataset.k); });
more.querySelector('b').onclick=()=>more.classList.toggle('op');
document.addEventListener('click',e=>{ if(!more.contains(e.target)) more.classList.remove('op'); });
draw();

</script>
