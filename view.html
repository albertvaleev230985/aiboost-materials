<!doctype html>
<html><head><meta charset="utf-8"><title>schedule view</title>
<style>html,body{margin:0;background:#1a1714;width:100%;height:100%}iframe{width:100vw;height:100vh;border:0;background:#1a1714}</style>
</head><body>
<iframe id="ifr" src="iiskra.html?probe=view"></iframe>
<script>
const ifr = document.getElementById('ifr');
ifr.addEventListener('load', () => {
  setTimeout(() => {
    try {
      const d = ifr.contentDocument;
      const sch = d.querySelector('.schedule');
      if (sch) {
        sch.scrollIntoView({ behavior: 'auto', block: 'center' });
        document.title = 'SCH_FOUND';
      } else {
        document.title = 'SCH_MISS';
      }
    } catch (e) { document.title = 'ERR_' + e.name; }
  }, 1500);
});
</script>
</body></html>
