<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <title>ИИ-шпаргалка · QR-экран · neovida</title>
  <style>
    :root {
      --void: #04050d;
      --paper: #f5f7ff;
      --paper-soft: rgba(245,247,255,.78);
      --paper-mute: rgba(245,247,255,.5);
      --paper-faint: rgba(245,247,255,.3);
      --cyan: #5ce1ff;
      --magenta: #ff4dd2;
      --lime: #b8ff3d;
      --coral: #ff7a5c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: var(--void);
      color: var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .screen {
      position: relative;
      width: 100vw; height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(ellipse 1200px 800px at 16% 14%, rgba(92,225,255,.15), transparent 60%),
        radial-gradient(ellipse 1000px 700px at 84% 86%, rgba(255,77,210,.12), transparent 60%),
        linear-gradient(135deg, #05060e 0%, #0a0d1d 55%, #06080f 100%);
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 56px 80px 48px;
    }
    .screen::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(180,200,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(180,200,255,.04) 1px, transparent 1px);
      background-size: 100px 100px;
      pointer-events: none;
      z-index: 1;
      mask-image: radial-gradient(ellipse 1500px 1000px at 50% 50%, #000 30%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 1500px 1000px at 50% 50%, #000 30%, transparent 100%);
    }

    .neural-bg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: .4;
    }
    .neural-bg .nl { stroke: rgba(92,225,255,.14); stroke-width: 1; fill: none; }
    .neural-bg .nd { fill: rgba(92,225,255,.65); }
    .neural-bg .nd.m { fill: rgba(255,77,210,.65); }
    .neural-bg .nd.l { fill: rgba(184,255,61,.65); }
    .neural-bg .pulse { animation: nodePulse 3.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .neural-bg .pulse.d1 { animation-delay: .3s; }
    .neural-bg .pulse.d2 { animation-delay: .9s; }
    .neural-bg .pulse.d3 { animation-delay: 1.5s; }
    .neural-bg .pulse.d4 { animation-delay: 2.1s; }
    @keyframes nodePulse {
      0%, 100% { opacity: .3; transform: scale(.85); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    /* top: only brand */
    .topline {
      position: relative; z-index: 3;
      display: flex; align-items: center; gap: 14px;
      font-size: 15px;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--paper-mute);
      font-weight: 800;
    }
    .topline .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--coral);
      box-shadow: 0 0 14px var(--coral), 0 0 28px rgba(255,122,92,.6);
      animation: blink 2.2s ease-in-out infinite;
    }
    .topline .name { color: var(--paper); }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }

    /* center — всё по центру, акцент на QR */
    .center {
      position: relative; z-index: 3;
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 40px;
      text-align: center;
    }
    .eyebrow {
      font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace;
      font-size: 17px;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--cyan);
    }
    .center h1 {
      font-size: 52px;
      line-height: 1.04;
      font-weight: 900;
      letter-spacing: -.02em;
      max-width: 1100px;
    }
    .center h1 .glow {
      background: linear-gradient(135deg, var(--cyan), var(--magenta));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .qr-frame {
      position: relative;
      padding: 30px;
      background: var(--paper);
      border-radius: 24px;
      box-shadow: 0 0 90px rgba(92,225,255,.4), 0 0 200px rgba(255,77,210,.22), 0 30px 80px rgba(0,0,0,.5);
      margin-top: 4px;
    }
    .qr-frame::before, .qr-frame::after {
      content: '';
      position: absolute;
      width: 48px; height: 48px;
      border-style: solid;
      border-color: var(--cyan);
      border-width: 0;
      filter: drop-shadow(0 0 8px rgba(92,225,255,.7));
    }
    .qr-frame::before { top: -16px; left: -16px; border-top-width: 4px; border-left-width: 4px; border-top-left-radius: 8px; }
    .qr-frame::after { bottom: -16px; right: -16px; border-bottom-width: 4px; border-right-width: 4px; border-bottom-right-radius: 8px; }
    .qr-frame img {
      display: block;
      width: 470px; height: 470px;
      image-rendering: pixelated;
    }

    .brand-under {
      display: grid;
      justify-items: center;
      gap: 10px;
    }
    .brand-under .name {
      font-size: 44px;
      font-weight: 900;
      letter-spacing: -.02em;
      line-height: 1;
    }
    .brand-under .sub {
      font-family: 'SF Mono', Menlo, monospace;
      font-size: 18px;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--cyan);
      font-weight: 700;
    }

    /* bottom: url center */
    .footer {
      position: relative; z-index: 3;
      text-align: center;
      color: var(--paper-mute);
      font-family: 'SF Mono', Menlo, monospace;
      font-size: 16px;
      letter-spacing: .08em;
    }
    .footer b { color: var(--cyan); }

    @media print {
      @page { size: 1920px 1080px; margin: 0; }
      html, body { width: 1920px; height: 1080px; }
      .screen { width: 1920px; height: 1080px; }
      .neural-bg, .topline .dot { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="screen">
    <svg class="neural-bg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <g class="lines">
        <path class="nl" d="M120 200 L380 320 L520 180 L760 280 L900 140"/>
        <path class="nl" d="M380 320 L420 540 L620 620 L820 540 L900 360"/>
        <path class="nl" d="M1260 480 L1340 720 L1560 800 L1740 720 L1820 540"/>
        <path class="nl" d="M520 180 L760 280 L900 360 L1080 240 L1260 200"/>
        <path class="nl" d="M180 700 L380 760 L620 820 L820 900 L1080 940"/>
        <path class="nl" d="M900 140 L1080 240 L1260 200 L1440 240 L1620 180"/>
      </g>
      <g class="nodes">
        <circle class="nd pulse" cx="120" cy="200" r="4"/>
        <circle class="nd m pulse d1" cx="380" cy="320" r="5"/>
        <circle class="nd pulse d2" cx="520" cy="180" r="4"/>
        <circle class="nd pulse d3" cx="760" cy="280" r="6"/>
        <circle class="nd m pulse d4" cx="900" cy="140" r="4"/>
        <circle class="nd l pulse d2" cx="620" cy="620" r="4"/>
        <circle class="nd m pulse d4" cx="900" cy="360" r="4"/>
        <circle class="nd pulse d1" cx="1260" cy="480" r="6"/>
        <circle class="nd m pulse d2" cx="1440" cy="420" r="4"/>
        <circle class="nd pulse d3" cx="1340" cy="720" r="5"/>
        <circle class="nd l pulse d4" cx="1560" cy="800" r="4"/>
        <circle class="nd m pulse d1" cx="1820" cy="540" r="5"/>
        <circle class="nd pulse d3" cx="1260" cy="200" r="5"/>
        <circle class="nd l pulse d4" cx="1620" cy="180" r="4"/>
        <circle class="nd pulse" cx="180" cy="700" r="5"/>
        <circle class="nd m pulse d2" cx="820" cy="900" r="6"/>
        <circle class="nd pulse d3" cx="1080" cy="940" r="4"/>
      </g>
    </svg>

    <div class="topline">
      <span class="dot"></span>
      <span class="name">neovida</span>
      <span>· нейропросвещение</span>
    </div>

    <div class="center">
      <div class="eyebrow">наведите камеру телефона на код</div>
      <h1>ИИ в обучении:<br><span class="glow">приручить, а не запретить</span></h1>
      <div class="qr-frame">
        <img src="qr-vsya-ufa.png" alt="QR на шпаргалку">
      </div>
      <div class="brand-under">
        <div class="name">neovida</div>
        <div class="sub">нейропросвещение</div>
      </div>
    </div>

    <div class="footer">
      materials.neovida.ai/<b>vsya-ufa-ai-children</b>
    </div>
  </div>
</body>
</html>
